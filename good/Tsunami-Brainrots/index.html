<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tsunami Brainrots Online</title>
        	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			overflow: visible;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
		.loadingOut{ 
				width:250px; 
				position:fixed; 
				left:50%; 
				top:calc(50% - 8px);
				transform:translate(-50%);
				 border: 2px solid white;
				height: 14px;
		}
		.centered {
 		 position: fixed;
		top: 50%;
		left: 50%;
		margin-top: -150px;
		margin-left: -250px;
		width: 500px;
		}
	</style>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">	
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: none;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <script>
      const hideFullScreenButton = "";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/813700ccfaf64a0a3c57e3aa3166490b.loader.js";
      const config = {
        dataUrl: buildUrl + "/7a1e99ebdb9e5844e21e1e49694dcef5.data.unityweb",
        frameworkUrl: buildUrl + "/cd3510ee0b8d474d79cb908415054498.framework.js.unityweb",
        codeUrl: buildUrl + "/c3475b90ffde8eb090daac72613df8c5.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Cursora Labs OÜ",
        productName: "Tsunami Brainrots Online",
        productVersion: "0.6",
        webglContextAttributes: {
    		preserveDrawingBuffer: true,
		powerPreference: "high-performance",
  	},
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1.5;
        } else {
            config.devicePixelRatio = 1;
        }
      
        // The background image when loading the game. When building a build, the code changes depending on the project settings.
        loadingCover.style.background = "url('./Build.png') center / cover";
        loadingCover.style.display = "";

	    var myGameInstance = null;
	  
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingCover.style.display = "none";

                // --- WEBGL <-> UNITY köprüsü ---
                const sendToUnity = (method, arg = "") => {
                    if (myGameInstance && myGameInstance.SendMessage) {
                        // GameObject adı: WebGLLifecycleBridge (Unity tarafında oluşturacağız)
                        myGameInstance.SendMessage("WebGLLifecycleBridge", method, String(arg));
                    }
                };

                // Bazı tarayıcılarda ses motoru (WebAudio) askıya alınabiliyor; görünür olunca zorla resume et.
                const resumeWebAudioIfNeeded = () => {
                    try {
                        const ctx =
                            myGameInstance?.Module?.webAudioContext ||
                            myGameInstance?.audioContext ||
                            window.AudioContext?.prototype; // fallback yoksa görmezden gel
                        if (ctx && ctx.state && ctx.state !== "running" && ctx.resume) {
                            ctx.resume();
                        }
                    } catch (e) { /* sessizce geç */ }
                };

                // Görünürlük değişimi (tab arka/ön plan)
                document.addEventListener("visibilitychange", () => {
                    if (document.visibilityState === "hidden") {
                        sendToUnity("OnPageHidden");
                    } else {
                        sendToUnity("OnPageVisible");
                        resumeWebAudioIfNeeded();
                    }
                });

                // Pencere odak kaybı/kazanımı (ör. başka app’e geçiş)
                window.addEventListener("blur", () => sendToUnity("OnPageHidden"));
                window.addEventListener("focus", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });

                // Sayfa yaşam döngüsü (Chrome/Android): pagehide/pageshow
                window.addEventListener("pagehide", () => sendToUnity("OnPageHidden"));
                window.addEventListener("pageshow", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });

                // Chrome "freeze/resume" (deneysel ama zararsız)
                window.addEventListener("freeze", () => sendToUnity("OnPageHidden"));
                window.addEventListener("resume", () => {
                    sendToUnity("OnPageVisible");
                    resumeWebAudioIfNeeded();
                });
                // --- /WEBGL <-> UNITY köprüsü ---
            }).catch((message) => {
                alert(message);
            });
        };
	  
      document.body.appendChild(script);
    </script>
  </body>
</html>
