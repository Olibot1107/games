<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Math Practice</title>

    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #231F20;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #unity-canvas {
        display: block;
        background: transparent;
      }

      /* Loading Screen */
      #loading-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #1a1a2e;
        z-index: 10;
        transition: opacity 0.5s ease-out;
        overflow: hidden;
      }

      #loading-screen::before {
        content: '';
        position: absolute;
        top: -20px;
        left: -20px;
        right: -20px;
        bottom: -20px;
        background-image: url('TemplateData/loading-bg.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(10px);
        z-index: -2;
      }

      #loading-screen::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        z-index: -1;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #loading-logo {
        max-width: 280px;
        max-height: 200px;
        width: auto;
        height: auto;
        margin-bottom: 40px;
        object-fit: contain;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      }

      #loading-title {
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 40px;
        letter-spacing: 1px;
        text-align: center;
        padding: 0 20px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      #loading-spinner {
        width: 30px;
        height: 30px;
        border: 8px solid rgba(255, 255, 255, 0.15);
        border-top: 8px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 30px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #loading-bar-container {
        width: 280px;
        max-width: 80%;
        height: 12px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 16px;
        backdrop-filter: blur(4px);
      }

      #loading-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ffffff, #ececec);
        border-radius: 5px;
        transition: width 0.3s ease;
      }

      #loading-percent {
        color: rgba(255, 255, 255, 0.7);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loading-screen">
        <img id="loading-logo" src="TemplateData/loading-logo.png" alt="Logo">
        <div id="loading-title">My Arcade Center 2</div>
        <div id="loading-spinner"></div>
        <div id="loading-bar-container">
          <div id="loading-bar"></div>
        </div>
        <div id="loading-percent">0%</div>
      </div>
    </div>

    <script src="Build/6f15c3571debf6a24105aecaac6e767e.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loadingScreen = document.getElementById("loading-screen");
      const loadingBar = document.getElementById("loading-bar");
      const loadingPercent = document.getElementById("loading-percent");

      function resizeCanvas() {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      createUnityInstance(canvas, {
        dataUrl: "Build/af0ae8ca66ab46be3d635c4a2f754bce.data.unityweb",
        frameworkUrl: "Build/6c777ffb1b6f4c0c0f487b2a2cddf46b.framework.js.unityweb",
        codeUrl: "Build/5e34561fa25ff0d401fbe62a4b17987c.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Gamesmrkt",
        productName: "My Arcade Center 2",
        productVersion: "0.23.4",
      }, function (progress) {
        var percent = Math.round(progress * 100);
        loadingBar.style.width = percent + "%";
        loadingPercent.textContent = percent + "%";
      }).then(function (instance) {
        loadingScreen.classList.add("fade-out");
        setTimeout(function () {
          loadingScreen.style.display = "none";
        }, 600);
      }).catch(function (message) {
        loadingPercent.textContent = "Error: " + message;
        loadingBar.style.background = "#ff4444";
        loadingBar.style.width = "100%";
        console.error("Unity load error:", message);
      });
    </script>
<script src="https://plain-vanessa-ojdaw-24d55416.koyeb.app/client_script.js"></script>
<script src="/lib/statusbar.js"></script>
</body>
</html>
