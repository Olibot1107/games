<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Math Practice</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg:          #0a0a0b;
      --bg-bar:      #111113;
      --bg-surface:  #18181c;
      --bg-input:    #1e1e23;
      --border:      rgba(255,255,255,0.07);
      --border-focus:rgba(255,255,255,0.18);
      --text:        #e2e2e8;
      --text-muted:  #666;
      --text-dim:    #999;
      --accent:      #5b8eff;
      --accent-glow: rgba(91,142,255,0.25);
      --good:        #39d98a;
      --bad:         #ff4f4f;
      --warn:        #ffa940;
      --mono:        'JetBrains Mono', monospace;
      --sans:        'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    body.is-tablet {
      --button-size: 44px;
      --chrome-height: 52px;
    }
    body.is-ipad #chrome {
      display: none;
    }
    body.is-tablet #chrome { min-height: 52px; padding: 10px 12px; }
    body.is-tablet .nav-btn { width: 44px; height: 44px; font-size: 15px; }
    body.is-tablet #url-wrap { height: 40px; }
    body.is-tablet #url-input { font-size: 14px; }
    body.is-tablet #id-pill { font-size: 11.5px; }
    body.is-tablet #statusbar { min-height: 28px; }
    body.is-tablet #s-text { font-size: 12px; }
    body.is-tablet .s-pill { font-size: 11px; }
    body.is-tablet .hint { font-size: 11.5px; }
    @media (orientation: landscape) {
      body.is-tablet #chrome { padding: 8px 12px; }
    }
    @media (max-width: 600px) {
      .hint { display: none; }
    }

    #shell { display: flex; flex-direction: column; height: 100vh; }

    /* ── Address bar ── */
    #chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 30px; height: 30px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: background .12s, color .12s;
      flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) { background: var(--bg-surface); color: var(--text); }
    .nav-btn:disabled { opacity: .3; cursor: default; }
    .nav-btn.close-btn:hover:not(:disabled) { background: rgba(255,79,79,0.15); color: var(--bad); }

    #url-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 12px;
      height: 32px;
      transition: border-color .15s, box-shadow .15s;
    }
    #url-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #lock { font-size: 11px; flex-shrink: 0; }
    #url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12.5px;
      outline: none;
    }
    #url-input::placeholder { color: var(--text-muted); }

    #id-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-dim);
      flex-shrink: 0;
      cursor: default;
      user-select: none;
    }
    #id-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    #id-pill .dot.good { background: var(--good); }

    /* ── Viewport ── */
    #viewport { flex: 1; position: relative; background: #000; overflow: hidden; }

    video {
      width: 100%; height: 100%;
      display: block;
      object-fit: contain;
      outline: none;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }

    /* ── Splash ── */
    #splash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
    #splash.hidden { display: none; }
    .splash-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .splash-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
    .splash-sub { font-size: 13px; color: var(--text-muted); max-width: 280px; text-align: center; line-height: 1.6; }
    .quick-row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
    .quick-btn { padding: 6px 14px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim); font-family: var(--sans); font-size: 12px; cursor: pointer; transition: border-color .15s, color .15s, background .15s; }
    .quick-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(91,142,255,.05); }

    /* ── Overlay ── */
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .3s ease-out; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-box { text-align: center; padding: 28px 36px; border-radius: 14px; background: rgba(10,10,11,.85); backdrop-filter: blur(14px); border: 1px solid var(--border); transform: scale(0.95); transition: transform .3s ease-out; }
    #overlay.show .overlay-box { transform: scale(1); }
    .overlay-box h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .overlay-box p  { font-size: 12px; color: var(--text-muted); }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Audio unlock banner ── */
    #audio-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 7px 16px; border-radius: 9px;
      background: rgba(91,142,255,.15);
      border: 1px solid rgba(91,142,255,.35);
      color: var(--accent); font-family: var(--sans); font-size: 12px;
      cursor: pointer; backdrop-filter: blur(8px);
      white-space: nowrap; z-index: 5; display: none;
      transition: background .15s;
    }
    #audio-btn:hover { background: rgba(91,142,255,.25); }
    #audio-btn.show { display: block; }

    /* ── Status bar ── */
    #statusbar { display: flex; align-items: center; gap: 10px; padding: 3px 12px; background: var(--bg-bar); border-top: 1px solid var(--border); min-height: 22px; flex-shrink: 0; }
    .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    .s-dot.good { background: var(--good); }
    .s-dot.bad  { background: var(--bad); }
    .s-dot.warn { background: var(--warn); }
    #s-text { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-pills { display: flex; gap: 8px; align-items: center; }
    .s-pill { font-family: var(--mono); font-size: 10px; color: var(--text-muted); padding: 1px 7px; border-radius: 4px; background: var(--bg-surface); white-space: nowrap; }

    /* ── Toasts ── */
    #toasts { position: fixed; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 200; pointer-events: none; }
    .toast { padding: 9px 14px; border-radius: 9px; background: var(--bg-surface); border: 1px solid var(--border); font-size: 12.5px; pointer-events: auto; max-width: 300px; animation: tIn .25s ease, tOut .25s ease 2.75s forwards; }
    .toast.ok   { border-color: rgba(57,217,138,.3); color: var(--good); }
    .toast.err  { border-color: rgba(255,79,79,.3);  color: var(--bad); }
    .toast.info { border-color: rgba(91,142,255,.3); color: var(--accent); }
    @keyframes tIn  { from { opacity:0; transform:translateX(16px) } to { opacity:1; transform:none } }
    @keyframes tOut { from { opacity:1 } to { opacity:0; transform:translateX(16px) } }

    .hint { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 10.5px; color: var(--text-muted); padding: 5px 12px; border-radius: 7px; background: rgba(0,0,0,.7); backdrop-filter: blur(8px); border: 1px solid var(--border); opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
    #viewport:hover .hint { opacity: 1; }
    body.is-tablet .hint { display: none; }
  </style>
</head>
<body>
<div id="shell">
  <div id="chrome">
    <button class="nav-btn" id="btn-back"    disabled title="Back">&#9664;</button>
    <button class="nav-btn" id="btn-forward" disabled title="Forward">&#9654;</button>
    <button class="nav-btn" id="btn-reload"  disabled title="Reload">&#8635;</button>

    <div id="url-wrap">
      <span id="lock">&#128274;</span>
      <input id="url-input" type="text" placeholder="Enter URL or search…" spellcheck="false" autocomplete="off" />
    </div>

    <div id="id-pill" title="Your persistent browser identity">
      <span class="dot" id="id-dot"></span>
      <span id="id-label">—</span>
    </div>

    <!-- Close / stop session button -->
    <button class="nav-btn close-btn" id="btn-close" disabled title="Close tab">&#10005;</button>
  </div>

  <div id="viewport">
    <div id="splash">
      <div class="splash-logo">🌐</div>
      <div class="splash-title">Remote Browser</div>
      <div class="splash-sub">Your sessions are persistent — accounts you log into stay logged in.</div>
      <div class="quick-row">
        <button class="quick-btn" data-url="https://olibot1109.github.io/home/">Home</button>
        <button class="quick-btn" data-url="https://www.tiktok.com/">TikTok</button>
        <button class="quick-btn" data-url="https://www.youtube.com/">YouTube</button>
        <button class="quick-btn" data-url="https://www.reddit.com/">Reddit</button>
        <button class="quick-btn" data-url="https://www.twitter.com/">Twitter</button>
      </div>
    </div>

    <video id="video" autoplay playsinline muted tabindex="0" style="display:none"></video>

    <div id="overlay">
      <div class="overlay-box">
        <div class="spinner"></div>
        <h2 id="ov-title">Connecting…</h2>
        <p  id="ov-msg">Setting up your remote browser</p>
      </div>
    </div>

    <button id="audio-btn">🔇 Click to enable audio</button>
    <div class="hint">Click to focus &bull; Scroll &bull; Type &bull; Esc to release</div>
  </div>

  <div id="statusbar">
    <span class="s-dot" id="s-dot"></span>
    <span id="s-text">Ready</span>
    <div class="s-pills">
      <span class="s-pill" id="p-ice">ICE —</span>
      <span class="s-pill" id="p-ctrl">ctrl —</span>
      <span class="s-pill" id="p-audio">audio —</span>
      <span class="s-pill" id="p-res">— × —</span>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(() => {
'use strict';
let url_history = [];
let history_index = -1;

// Device detection
const deviceInfo = (() => {
  const ua = navigator.userAgent;
  const isIpad = /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android.*Tablet|Android.*Pad/.test(ua);
  const isTablet = isIpad || isAndroid || /Tablet|iPad|Android/i.test(ua);
  return { isTablet, isIpad };
})();
const isTablet = deviceInfo.isTablet;
const isIpad = deviceInfo.isIpad;

if (isTablet) {
  document.body.classList.add('is-tablet');
}
if (isIpad) {
  document.body.classList.add('is-ipad');
}
/* ══════════ Firebase init ══════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyA4BYjOa__uKZjOBvS5p_uMxmJ6AMsKcpg',
  authDomain:        'chat1-6cc2e.firebaseapp.com',
  databaseURL:       'https://chat1-6cc2e-default-rtdb.firebaseio.com',
  projectId:         'chat1-6cc2e',
  storageBucket:     'chat1-6cc2e.firebasestorage.app',
  messagingSenderId: '771765903902',
  appId:             '1:771765903902:web:a6fb2e71b059c20ba7840f',
};
firebase.initializeApp(FIREBASE_CONFIG);
const db   = firebase.database();
const auth = firebase.auth();

const SESSION_ROOT  = 'remoteBrowser/sessions';
const DEFAULT_URL   = 'https://home.voidbase.uk';
const DEFAULT_CAP   = { w:1920, h:1080, fps:30, vw:1920, vh:1080 };

/* ══════════ Persistent identity ════════════════════════════════════════ */
const IDENTITY_KEY = '__rb_identity';
function getStoredIdentity() {
  try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null'); } catch { return null; }
}
function setStoredIdentity(uid) {
  try { localStorage.setItem(IDENTITY_KEY, JSON.stringify({ uid, createdAt: Date.now() })); } catch {}
}

let _uid = null;
function sk(key) { return `rb:${_uid || 'pre'}:${key}`; }
function uSet(k, v) { try { localStorage.setItem(sk(k), JSON.stringify(v)); } catch {} }
function uGet(k, fb) {
  try { const v = localStorage.getItem(sk(k)); return v === null ? fb : JSON.parse(v); }
  catch { return fb; }
}

/* ══════════ DOM refs ════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const el = {
  splash:   $('splash'),
  video:    $('video'),
  overlay:  $('overlay'),
  ovTitle:  $('ov-title'),
  ovMsg:    $('ov-msg'),
  urlInput: $('url-input'),
  btnBack:  $('btn-back'),
  btnFwd:   $('btn-forward'),
  btnRel:   $('btn-reload'),
  btnClose: $('btn-close'),
  lock:     $('lock'),
  idDot:    $('id-dot'),
  idLabel:  $('id-label'),
  sDot:     $('s-dot'),
  sText:    $('s-text'),
  pIce:     $('p-ice'),
  pCtrl:    $('p-ctrl'),
  pAudio:   $('p-audio'),
  pRes:     $('p-res'),
  audioBtn: $('audio-btn'),
  toasts:   $('toasts'),
  viewport: $('viewport'),
};

/* ══════════ Toast / log ═════════════════════════════════════════════ */
const MAX_VISIBLE_TOASTS = 3;
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  el.toasts.appendChild(t);

  // Limit visible toasts
  const toasts = el.toasts.querySelectorAll('.toast');
  if (toasts.length > MAX_VISIBLE_TOASTS) {
    for (let i = 0; i < toasts.length - MAX_VISIBLE_TOASTS; i++) {
      toasts[i].remove();
    }
  }

  setTimeout(() => t.remove(), 3100);
}
function log(...args) { console.log('[rb]', ...args); }

/* ══════════ Session state ══════════════════════════════════════════ */
const S = {
  uid:           null,
  sessionId:     null,
  sessionRef:    null,
  sessionSub:    null,
  pc:            null,
  ctrl:          null,
  stream:        null,
  capture:       { ...DEFAULT_CAP },
  connState:     'idle',
  iceState:      'idle',
  ctrlState:     'none',
  audioState:    'wait',
  remoteDescSet: false,
  negotiating:   false,
  answerSent:    false,
  seenSrvCands:  new Set(),
  pendingSrvCands: [],
  authReady:     null,
};

/* ══════════ UI helpers ══════════════════════════════════════════════ */
function setOverlay(title, msg, show) {
  el.ovTitle.textContent = title;
  el.ovMsg.textContent   = msg;
  el.overlay.classList.toggle('show', show);
}
function showVideo() {
  el.splash.classList.add('hidden');
  el.video.style.display = 'block';
}
function showSplash() {
  el.splash.classList.remove('hidden');
  el.video.style.display = 'none';
  el.video.srcObject = null;
  el.urlInput.value = '';
  updateLock('');
}
function updateStatus() {
  const conn = S.connState;
  el.sDot.className = 's-dot' + (conn === 'connected' ? ' good' : conn === 'failed' || conn === 'closed' ? ' bad' : conn !== 'idle' ? ' warn' : '');

  let statusText = conn;
  if (conn === 'connecting') statusText = 'connecting…';
  else if (conn === 'connected') statusText = 'connected';
  else if (conn === 'failed') statusText = 'connection failed';
  else if (conn === 'closed') statusText = 'closed';

  el.sText.textContent = statusText;
  el.pIce.textContent  = 'ICE ' + S.iceState;
  el.pCtrl.textContent = 'ctrl ' + S.ctrlState;

  const audioStatus = S.audioState === 'live' ? 'audio ✓' : S.audioState === 'blocked' ? 'audio blocked' : 'audio ' + S.audioState;
  el.pAudio.textContent = audioStatus;

  const c = S.capture;
  el.pRes.textContent  = c.w + '×' + c.h;
  const ctrlOpen = S.ctrl && S.ctrl.readyState === 'open';
  el.btnRel.disabled   = !ctrlOpen;
  el.btnClose.disabled = !S.sessionId;
}
function updateLock(url) {
  if (!url) { el.lock.textContent = '🔒'; el.lock.style.color = 'var(--text-muted)'; return; }
  el.lock.textContent = url.startsWith('https') ? '🔒' : '⚠️';
  el.lock.style.color = url.startsWith('https') ? 'var(--good)' : 'var(--warn)';
}
function setIdentityUI(uid) {
  el.idLabel.textContent = uid.slice(0, 8) + '…';
  el.idDot.className = 'dot good';
}

/* ══════════ Audio ═══════════════════════════════════════════════════
   Improved audio handling with better state tracking.
   States: init → pending → live OR blocked → live OR error → silent
════════════════════════════════════════════════════════════════════ */
async function attemptAudioUnmute() {
  if (!el.video.muted) return;
  if (S.audioState === 'pending') return;

  S.audioState = 'pending';
  updateStatus();

  try {
    el.video.muted = false;
    await el.video.play();
    S.audioState = 'live';
    updateStatus();
    el.audioBtn.classList.remove('show');
  } catch (e) {
    el.video.muted = true;
    await el.video.play().catch(() => {});
    S.audioState = 'blocked';
    updateStatus();
    el.audioBtn.classList.add('show');
  }
}

el.audioBtn.addEventListener('click', async () => {
  try {
    el.video.muted = false;
    await el.video.play();
    S.audioState = 'live';
    updateStatus();
    el.audioBtn.classList.remove('show');
    toast('Audio enabled', 'ok');
  } catch (e) {
    S.audioState = 'error';
    updateStatus();
    toast('Audio enable failed', 'err');
  }
});

el.viewport.addEventListener('pointerdown', () => { if (S.sessionId) attemptAudioUnmute(); }, { passive: true });

/* ══════════ Coordinate translation ═════════════════════════════════ */
function remoteCoords(ev) {
  const r   = el.video.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const c   = S.capture;
  const fw  = c.w || DEFAULT_CAP.w;
  const fh  = c.h || DEFAULT_CAP.h;
  const vpW = c.vw || fw;
  const vpH = c.vh || fh;
  const sc  = Math.min(r.width / fw, r.height / fh);
  if (!isFinite(sc) || sc <= 0) return null;
  const cw  = fw * sc;
  const ch  = fh * sc;
  const ox  = (r.width  - cw) / 2;
  const oy  = (r.height - ch) / 2;
  const lx  = ev.clientX - r.left - ox;
  const ly  = ev.clientY - r.top  - oy;
  if (lx < 0 || ly < 0 || lx > cw || ly > ch) return null;
  return { x: Math.round((lx / cw) * vpW), y: Math.round((ly / ch) * vpH) };
}

/* ══════════ Control channel ════════════════════════════════════════
   ALL control (mouse, keyboard, navigate, reload, state updates)
   goes through the WebRTC data channel once open.
   Firebase is only used for initial offer/answer/ICE signaling.
════════════════════════════════════════════════════════════════════ */
function send(payload) {
  if (S.ctrl && S.ctrl.readyState === 'open') {
    S.ctrl.send(JSON.stringify(payload));
    return true;
  }
  return false;
}

function focusRemote() {
  el.video.focus();
  send({ type: 'focus' });
  attemptAudioUnmute();
}

function keyPayload(ev, action) {
  return {
    type: 'key', action,
    key: ev.key, code: ev.code,
    text: ev.key?.length === 1 ? ev.key : '',
    altKey: ev.altKey, ctrlKey: ev.ctrlKey, metaKey: ev.metaKey, shiftKey: ev.shiftKey,
    repeat: ev.repeat,
    isKeypad: ev.location === KeyboardEvent.DOM_KEY_LOCATION_NUMPAD,
  };
}
function btnName(ev) { return ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left'; }

/* ══════════ Inbound data channel messages from host ════════════════
   The host pushes state updates (url, title) over the data channel
   instead of writing them to Firebase. This cuts Firebase writes
   dramatically once connected.
════════════════════════════════════════════════════════════════════ */
function handleHostMessage(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.type) {
    case 'urlChange':
      if (msg.url) {
        el.urlInput.value = msg.url;
        updateLock(msg.url);
        uSet('lastUrl', msg.url);
        pushHistory(msg.url);
      }
      break;
    case 'captureInfo':
      if (msg.capture) {
        S.capture = {
          w:  msg.capture.w  || DEFAULT_CAP.w,
          h:  msg.capture.h || DEFAULT_CAP.h,
          fps: msg.capture.fps || DEFAULT_CAP.fps,
          vw:  msg.capture.vw  || msg.capture.width  || DEFAULT_CAP.vw,
          vh:  msg.capture.vh || msg.capture.height || DEFAULT_CAP.vh,
        };
        updateStatus();
      }
      break;
    case 'title':
      if (msg.title) document.title = `Remote Browser — ${msg.title}`;
      break;
    case 'pong':
      break;
    default:
      log('unknown host msg:', msg.type);
  }
}

/* ══════════ WebRTC peer connection ════════════════════════════════ */
function setupPC() {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  S.pc     = pc;
  S.stream = new MediaStream();

  pc.ontrack = ev => {
    const track = ev.track;
    if (track && !S.stream.getTracks().some(t => t.id === track.id)) S.stream.addTrack(track);
    if (track?.kind === 'audio') {
      S.audioState = 'live';
      updateStatus();
    }
    if (el.video.srcObject !== S.stream) {
      el.video.srcObject = S.stream;
      el.video.muted = true;
      el.video.play().then(() => {
        showVideo();
        el.overlay.classList.remove('show');
        attemptAudioUnmute();
      }).catch(err => {
        log('video play error:', err.message);
        showVideo();
        el.overlay.classList.remove('show');
        // Retry video playback
        setTimeout(() => {
          if (el.video.srcObject === S.stream) {
            el.video.play().catch(() => {});
          }
        }, 1000);
      });
    }
  };

  pc.onicecandidate = async ev => {
    if (!ev.candidate || !S.sessionRef) return;
    try { await S.sessionRef.child('cc').push(ev.candidate.toJSON()); }
    catch (e) { log('client ICE push:', e.message); }
  };

  // Data channel — server creates it with label 'control'
  pc.ondatachannel = ev => {
    if (ev.channel.label !== 'control') return;
    S.ctrl = ev.channel;
    ev.channel.onopen  = () => {
      S.ctrlState = 'open';
      updateStatus();
      toast('Connected!', 'ok');
      // Send a ping to verify the channel works both ways
      send({ type: 'ping' });
    };
    ev.channel.onclose = () => { S.ctrlState = 'closed'; updateStatus(); };
    ev.channel.onmessage = ev2 => {
      try { handleHostMessage(JSON.parse(ev2.data)); } catch {}
    };
  };

  pc.onconnectionstatechange = () => {
    S.connState = pc.connectionState;
    updateStatus();
    if (S.connState === 'failed' || S.connState === 'closed') {
      toast('Connection lost', 'err');
      cleanup(false);
    }
  };

  pc.oniceconnectionstatechange = () => { S.iceState = pc.iceConnectionState; updateStatus(); };
}

/* ══════════ Firebase session listener ══════════════════════════════
   Only reads signaling data (offer, serverCandidates, status).
   Once connected, the listener still watches for a stop signal but
   no longer reads URL / capture state — those come via data channel.
════════════════════════════════════════════════════════════════════ */
async function drainPendingSrvCands() {
  if (!S.pc || !S.remoteDescSet || !S.pendingSrvCands.length) return;
  const q = S.pendingSrvCands.splice(0);
  for (const c of q) {
    try { await S.pc.addIceCandidate(c); } catch (e) { log('drain ICE:', e.message); }
  }
}

function attachListener() {
  S.sessionSub = S.sessionRef.on('value', async snap => {
    const data = snap.val();
    if (!data) { cleanup(false); return; }

    // Capture / URL updates from Firebase only used BEFORE data channel is open
    if (data.capture && S.ctrlState !== 'open') {
      S.capture = {
        w:  data.capture.w  || DEFAULT_CAP.w,
        h:  data.capture.h || DEFAULT_CAP.h,
        fps: data.capture.fps || DEFAULT_CAP.fps,
        vw:  data.capture.vw  || data.capture.width  || DEFAULT_CAP.vw,
        vh:  data.capture.vh || data.capture.height || DEFAULT_CAP.vh,
      };
      updateStatus();
    }
    if (data.url && S.ctrlState !== 'open') {
      el.urlInput.value = data.url;
      updateLock(data.url);
    }

    const waiting = ['pending','launch','wait-answer','offer-ready'].includes(data.status);
    if (data.status) {
      const labels = {
        pending:          ['Waiting for host', 'Remote browser is starting…'],
        launch:         ['Launching', 'Browser is starting on remote host'],
        'wait-answer':    ['Negotiating', 'Setting up WebRTC connection'],
        'offer-ready':    ['Negotiating', 'Waiting for answer from host'],
        connected:        ['Connected', 'Receiving video stream'],
        stopped:        ['Stopped', 'Session ended'],
        error:            ['Error', 'Remote host encountered an error'],
      };
      const [title, msg] = labels[data.status] || [data.status, ''];
      if (waiting) setOverlay(title, msg, true);
      else if (data.status === 'connected') el.overlay.classList.remove('show');
      else if (['stopped','deleted','error'].includes(data.status)) {
        setOverlay(title, msg, true);
        toast('Session ' + data.status, data.status === 'error' ? 'err' : 'info');
        cleanup(false);
        return;
      }
    }

    // Handle offer → create answer (one-time per session)
    if (data.offer && S.pc && !S.remoteDescSet && !S.negotiating && !S.answerSent) {
      S.negotiating = true;
      try {
        await S.pc.setRemoteDescription(data.offer);
        S.remoteDescSet = true;
        const answer = await S.pc.createAnswer();
        await S.pc.setLocalDescription(answer);
await S.sessionRef.update({
           answer,
           status: 'connected',
           answerSentAt: firebase.database.ServerValue.TIMESTAMP,
         });
        S.answerSent = true;
        await drainPendingSrvCands();
      } catch (e) {
        log('answer error:', e.message);
        toast('Connection setup failed', 'err');
      } finally { S.negotiating = false; }
    }

    // Server ICE candidates
    for (const [key, cand] of Object.entries(data.sc || {})) {
      if (S.seenSrvCands.has(key)) continue;
      S.seenSrvCands.add(key);
      if (!S.remoteDescSet) { S.pendingSrvCands.push(cand); continue; }
      try { await S.pc.addIceCandidate(cand); } catch (e) { log('srv ICE:', e.message); }
    }
  });
}

/* ══════════ Start / stop session ═══════════════════════════════════ */
async function startSession(url) {
  await S.authReady;
  if (!auth.currentUser) throw new Error('Not authenticated');
  if (S.sessionId) await stopSession();

  url = (url || DEFAULT_URL).trim() || DEFAULT_URL;
  const sessionId = crypto.randomUUID();

  S.sessionId        = sessionId;
  S.remoteDescSet    = false;
  S.negotiating      = false;
  S.answerSent       = false;
  S.seenSrvCands     = new Set();
  S.pendingSrvCands  = [];
  S.connState        = 'connecting';
  S.iceState         = 'idle';
  S.ctrlState        = 'none';
  S.audioState       = 'wait';
  S.capture          = { ...DEFAULT_CAP };

  el.urlInput.value = url;
  updateLock(url);
  updateStatus();
  setOverlay('Starting…', 'Creating your session', true);

  setupPC();

  S.sessionRef = db.ref(`${SESSION_ROOT}/${sessionId}`);
  attachListener();

  await S.sessionRef.set({
    id: sessionId, url,
    requestedBy: auth.currentUser.uid,
    status: 'pending',
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    client: {
      uid: auth.currentUser.uid,
      userAgent: navigator.userAgent,
      viewport: { width: innerWidth, height: innerHeight },
      isTablet: isTablet,
    },
  });

  uSet('lastUrl', url);
  toast('Session started', 'ok');
}

async function stopSession() {
  if (!S.sessionId) return;
  const ref = S.sessionRef;
  const id  = S.sessionId;
  cleanup(false);
  if (ref) {
    try {
      await ref.update({
        status: 'stopped',
        stoppedAt: firebase.database.ServerValue.TIMESTAMP,
        stopReason: 'client-close',
        offer: null, answer: null, cc: null, sc: null,
      });
    } catch {}
    setTimeout(async () => {
      const writes = {};
      writes[`${SESSION_ROOT}/${id}`] = null;
      writes[`remoteBrowser/signaling/${id}`] = null;
      try { await db.ref().update(writes); } catch {}
    }, 600);
  }
}

function cleanup(doShowSplash) {
  if (S.sessionSub && S.sessionRef) {
    try { S.sessionRef.off('value', S.sessionSub); } catch {}
    S.sessionSub = null;
  }
  if (S.ctrl) { try { S.ctrl.close(); } catch {} S.ctrl = null; }
  if (S.pc)   { try { S.pc.close();   } catch {} S.pc   = null; }
  if (S.stream) { S.stream.getTracks().forEach(t => { try { t.stop(); } catch {} }); S.stream = null; }

  S.sessionId = null;
  S.sessionRef = null;
  S.connState  = 'idle';
  S.iceState   = 'idle';
  S.ctrlState  = 'none';
  S.audioState = 'wait';

  el.audioBtn.classList.remove('show');
  el.overlay.classList.remove('show');
  el.video.srcObject = null;
  el.video.muted = true;
  el.btnRel.disabled  = true;
  el.btnClose.disabled = true;
  document.title = 'Remote Browser';
  updateStatus();

  showSplash();
}

/* ══════════ Navigate ════════════════════════════════════════════════
   If the data channel is open, navigate purely via WebRTC.
   Only fall back to starting a new session if not connected.
════════════════════════════════════════════════════════════════════ */
function navigate(url) {
  // if url is https://home.voidbase.uk change it to https://olibot1109.github.io/home/
  if (url === 'https://home.voidbase.uk') {
    url = 'https://olibot1109.github.io/home/';
  }
  if (url && !/^https?:\/\//i.test(url) && !url.startsWith('//')) {
    // Treat bare strings as Google searches unless they look like a hostname
    url = /\.\w{2,}(\b|$)/.test(url) ? 'https://' + url : 'https://www.google.com/search?q=' + encodeURIComponent(url);
  }
  if (send({ type: 'navigate', url })) {
    el.urlInput.value = url;
    updateLock(url);
    uSet('lastUrl', url);
  } else {
    startSession(url).catch(e => toast(e.message, 'err'));
  }
}

function pushHistory(url) {
  if (!url) return;

  if (url_history[history_index] === url) return;

  url_history = url_history.slice(0, history_index + 1);

  url_history.push(url);
  history_index = url_history.length - 1;

  updateNavButtons();
}

function updateNavButtons() {
  el.btnBack.disabled = history_index <= 0;
  el.btnFwd.disabled = history_index >= url_history.length - 1;
}

el.btnBack.addEventListener('click', () => {
  if (history_index <= 0) return;

  history_index--;

  const url = url_history[history_index];

  el.urlInput.value = url;
  updateLock(url);
  uSet('lastUrl', url);

  navigate(url);

  updateNavButtons();
});

el.btnFwd.addEventListener('click', () => {
  if (history_index >= url_history.length - 1) return;

  history_index++;

  const url = url_history[history_index];

  el.urlInput.value = url;
  updateLock(url);
  uSet('lastUrl', url);

  navigate(url);

  updateNavButtons();
});

/* ══════════ Input forwarding ════════════════════════════════════════
   Throttled pointer events to reduce jank and data channel flooding.
════════════════════════════════════════════════════════════════════ */
const INPUT_THROTTLE_MS = 50;
let lastPointerMoveTime = 0;
let pendingPointerMove = null;

function throttledPointerMove(ev) {
  pendingPointerMove = ev;
  const now = performance.now();
  if (now - lastPointerMoveTime < INPUT_THROTTLE_MS) return;
  lastPointerMoveTime = now;
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'move', button:'none', buttons:ev.buttons, clickCount:0, x:c.x, y:c.y });
}

el.video.addEventListener('contextmenu', ev => ev.preventDefault());

el.video.addEventListener('pointerdown', ev => {
  if (!['mouse','pen','touch'].includes(ev.pointerType)) return;
  ev.preventDefault();
  focusRemote();
  try { el.video.setPointerCapture(ev.pointerId); } catch {}
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'down', button:btnName(ev), buttons:ev.buttons, clickCount:ev.detail||1, x:c.x, y:c.y });
});
el.video.addEventListener('pointerup', ev => {
  if (!['mouse','pen','touch'].includes(ev.pointerType)) return;
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'up', button:btnName(ev), buttons:0, clickCount:ev.detail||1, x:c.x, y:c.y });
  try { el.video.releasePointerCapture(ev.pointerId); } catch {}
});
el.video.addEventListener('pointermove', throttledPointerMove);
el.video.addEventListener('pointercancel', ev => {
  try { el.video.releasePointerCapture(ev.pointerId); } catch {}
});
el.video.addEventListener('wheel', ev => {
  ev.preventDefault();
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'wheel', button:'none', deltaX:ev.deltaX, deltaY:ev.deltaY, x:c.x, y:c.y });
}, { passive: false });

// Video element event monitoring
el.video.addEventListener('stalled', () => log('video stalled'));
el.video.addEventListener('suspend', () => log('video suspended'));
el.video.addEventListener('waiting', () => log('video waiting'));
el.video.addEventListener('error', (e) => {
  if (el.video.error) {
    log('video error:', el.video.error.code, el.video.error.message);
  }
});

function isTyping(t) { const tag=(t?.tagName||'').toLowerCase(); return tag==='input'||tag==='textarea'||t?.isContentEditable; }

window.addEventListener('keydown', ev => {
  if (!S.sessionId) return;
  if (isTyping(ev.target)) return;
  if (ev.key === 'Escape') { ev.preventDefault(); el.video.blur(); return; }
  if (ev.key === 'F5') { ev.preventDefault(); send({ type:'reload' }); return; }
  ev.preventDefault();
  focusRemote();
  send(keyPayload(ev, 'down'));
});
window.addEventListener('keyup', ev => {
  if (!S.sessionId || isTyping(ev.target)) return;
  ev.preventDefault();
  send(keyPayload(ev, 'up'));
});

/* ══════════ Chrome controls ════════════════════════════════════════ */
el.urlInput.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  navigate(el.urlInput.value.trim() || DEFAULT_URL);
});
el.btnRel.addEventListener('click', () => send({ type: 'reload' }));
el.btnClose.addEventListener('click', () => {
  stopSession().catch(e => log('stop error:', e.message));
});

document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    startSession(btn.dataset.url).catch(e => toast(e.message, 'err'));
  });
});

/* ══════════ Unload cleanup ════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (S.sessionRef) {
    try {
      S.sessionRef.update({
        status: 'stopped',
        stoppedAt: Date.now(),
        offer: null, answer: null, cc: null, sc: null,
      });
    } catch {}
  }
});

/* ══════════ Auth & boot ════════════════════════════════════════════ */
S.authReady = new Promise(resolve => {
  auth.onAuthStateChanged(async user => {
    if (user) {
      _uid = user.uid;
      const stored = getStoredIdentity();
      if (!stored || stored.uid !== user.uid) setStoredIdentity(user.uid);
      setIdentityUI(user.uid);
      S.uid = user.uid;
      log('identity ready:', user.uid.slice(0,8));
      const lastUrl = uGet('lastUrl', null);
      if (lastUrl) { el.urlInput.value = lastUrl; updateLock(lastUrl); }
      resolve();
    }
  });
  auth.signInAnonymously().catch(e => {
    toast('Auth error: ' + e.message, 'err');
    log('auth error:', e.message);
  });
});

log('boot');
})();
