<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Math Practice</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap');

    :root {
      --bg:          #0a0a0b;
      --bg-bar:      #111113;
      --bg-surface:  #18181c;
      --bg-input:    #1e1e23;
      --border:      rgba(255,255,255,0.07);
      --border-focus:rgba(255,255,255,0.18);
      --text:        #e2e2e8;
      --text-muted:  #666;
      --text-dim:    #999;
      --accent:      #5b8eff;
      --accent-glow: rgba(91,142,255,0.25);
      --good:        #39d98a;
      --bad:         #ff4f4f;
      --warn:        #ffa940;
      --mono:        'JetBrains Mono', monospace;
      --sans:        'Syne', sans-serif;
      /* Safe area insets for iPad notch/home bar */
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Use dvh so Safari's collapsing address bar doesn't cause overflow */
    html { height: 100%; height: -webkit-fill-available; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      height: 100%;
      height: -webkit-fill-available;
      /* Prevent iOS bounce scroll on the body */
      overscroll-behavior: none;
      overflow: hidden;
    }

    #shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: -webkit-fill-available;
      /* Respect safe areas */
      padding-top: var(--sat);
      padding-left: var(--sal);
      padding-right: var(--sar);
      padding-bottom: var(--sab);
    }

    /* ── Address bar ── */
    #chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      flex-shrink: 0;
      /* Prevent text selection on toolbar on iOS */
      -webkit-user-select: none;
      user-select: none;
    }

    .nav-btn {
      width: 36px; height: 36px; /* Larger tap target for touch */
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: background .12s, color .12s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .nav-btn:hover:not(:disabled) { background: var(--bg-surface); color: var(--text); }
    .nav-btn:active:not(:disabled) { background: var(--bg-surface); color: var(--text); }
    .nav-btn:disabled { opacity: .3; cursor: default; }
    .nav-btn.close-btn:hover:not(:disabled),
    .nav-btn.close-btn:active:not(:disabled) { background: rgba(255,79,79,0.15); color: var(--bad); }

    #url-wrap {
      flex: 1;
      min-width: 0; /* Allow shrinking */
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 10px;
      height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    #url-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    #lock { font-size: 11px; flex-shrink: 0; }
    #url-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      /* iOS: prevent zoom on focus (font-size >= 16 avoids zoom, but 13px is fine with meta viewport) */
      -webkit-appearance: none;
      appearance: none;
    }
    #url-input::placeholder { color: var(--text-muted); }

    #id-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-dim);
      flex-shrink: 0;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
      /* Hide on very small screens */
    }
    @media (max-width: 480px) { #id-pill { display: none; } }
    #id-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    #id-pill .dot.good { background: var(--good); }

    /* ── Viewport ── */
    #viewport { flex: 1; position: relative; background: #000; overflow: hidden; min-height: 0; }

    video {
      width: 100%; height: 100%;
      display: block;
      object-fit: contain;
      outline: none;
      /* crosshair works on desktop; pointer is fine on touch */
      cursor: crosshair;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Splash ── */
    #splash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 16px; }
    #splash.hidden { display: none; }
    .splash-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .splash-title { font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
    .splash-sub { font-size: 13px; color: var(--text-muted); max-width: 280px; text-align: center; line-height: 1.6; }
    .quick-row { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
    .quick-btn {
      padding: 8px 16px; /* Larger tap target */
      border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim); font-family: var(--sans); font-size: 13px; cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 44px; /* iOS recommended minimum */
    }
    .quick-btn:hover, .quick-btn:active { border-color: var(--accent); color: var(--accent); background: rgba(91,142,255,.05); }

    /* ── Overlay ── */
    #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .2s; }
    #overlay.show { opacity: 1; pointer-events: auto; }
    .overlay-box { text-align: center; padding: 28px 36px; border-radius: 14px; background: rgba(10,10,11,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); }
    .overlay-box h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .overlay-box p  { font-size: 12px; color: var(--text-muted); }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Audio unlock banner ── */
    #audio-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 9px;
      background: rgba(91,142,255,.15);
      border: 1px solid rgba(91,142,255,.35);
      color: var(--accent); font-family: var(--sans); font-size: 13px;
      cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      white-space: nowrap; z-index: 5; display: none;
      transition: background .15s;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #audio-btn:hover, #audio-btn:active { background: rgba(91,142,255,.25); }
    #audio-btn.show { display: flex; align-items: center; }

    /* ── Touch gesture hint (replaces mouse hint) ── */
    .hint {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: 10.5px; color: var(--text-muted);
      padding: 5px 12px; border-radius: 7px;
      background: rgba(0,0,0,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border); opacity: 0; transition: opacity .25s;
      pointer-events: none; white-space: nowrap;
    }
    /* On touch devices, show hint briefly on first touch */
    #viewport:hover .hint,
    #viewport.touch-hint .hint { opacity: 1; }

    /* ── Status bar ── */
    #statusbar {
      display: flex; align-items: center; gap: 10px;
      padding: 3px 12px; background: var(--bg-bar);
      border-top: 1px solid var(--border); min-height: 22px; flex-shrink: 0;
    }
    .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    .s-dot.good { background: var(--good); }
    .s-dot.bad  { background: var(--bad); }
    .s-dot.warn { background: var(--warn); }
    #s-text { flex: 1; font-family: var(--mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s-pills { display: flex; gap: 8px; align-items: center; }
    .s-pill { font-family: var(--mono); font-size: 10px; color: var(--text-muted); padding: 1px 7px; border-radius: 4px; background: var(--bg-surface); white-space: nowrap; }
    /* Hide some pills on smaller screens */
    @media (max-width: 600px) {
      #p-ice, #p-ctrl { display: none; }
    }

    /* ── Toasts ── */
    #toasts { position: fixed; top: calc(10px + var(--sat)); right: 10px; display: flex; flex-direction: column; gap: 5px; z-index: 200; pointer-events: none; }
    .toast { padding: 9px 14px; border-radius: 9px; background: var(--bg-surface); border: 1px solid var(--border); font-size: 12.5px; pointer-events: auto; max-width: 300px; animation: tIn .25s ease, tOut .25s ease 2.75s forwards; }
    .toast.ok   { border-color: rgba(57,217,138,.3); color: var(--good); }
    .toast.err  { border-color: rgba(255,79,79,.3);  color: var(--bad); }
    .toast.info { border-color: rgba(91,142,255,.3); color: var(--accent); }
    @keyframes tIn  { from { opacity:0; transform:translateX(16px) } to { opacity:1; transform:none } }
    @keyframes tOut { from { opacity:1 } to { opacity:0; transform:translateX(16px) } }

    /* ── On-screen keyboard trigger (iPad) ── */
    #kbd-trigger {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px; height: 1px;
      top: 0; left: 0;
      /* Must not be display:none or iOS won't focus it */
    }
    #kbd-overlay {
      position: absolute;
      bottom: 60px; right: 12px;
      z-index: 10;
      display: none;
    }
    #kbd-overlay.show { display: block; }
    #kbd-btn {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: rgba(30,30,35,0.9);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #kbd-btn:active { background: var(--bg-surface); color: var(--text); }
  </style>
</head>
<body>
<div id="shell">
  <div id="chrome">
    <button class="nav-btn" id="btn-back"    disabled title="Back">&#9664;</button>
    <button class="nav-btn" id="btn-forward" disabled title="Forward">&#9654;</button>
    <button class="nav-btn" id="btn-reload"  disabled title="Reload">&#8635;</button>

    <div id="url-wrap">
      <span id="lock">&#128274;</span>
      <input id="url-input" type="url" inputmode="url" placeholder="Enter URL or search…" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="none" />
    </div>

    <div id="id-pill" title="Your persistent browser identity">
      <span class="dot" id="id-dot"></span>
      <span id="id-label">—</span>
    </div>

    <button class="nav-btn close-btn" id="btn-close" disabled title="Close tab">&#10005;</button>
  </div>

  <div id="viewport">
    <div id="splash">
      <div class="splash-logo">🌐</div>
      <div class="splash-title">Remote Browser</div>
      <div class="splash-sub">Your sessions are persistent — accounts you log into stay logged in.</div>
      <div class="quick-row">
        <button class="quick-btn" data-url="https://olibot1109.github.io/home/">Home</button>
        <button class="quick-btn" data-url="https://www.tiktok.com/">TikTok</button>
        <button class="quick-btn" data-url="https://www.youtube.com/">YouTube</button>
        <button class="quick-btn" data-url="https://www.reddit.com/">Reddit</button>
        <button class="quick-btn" data-url="https://www.twitter.com/">Twitter</button>
      </div>
    </div>

    <!-- Hidden input that tricks iOS into showing the keyboard -->
    <input id="kbd-trigger" type="text" aria-hidden="true" tabindex="-1" />

    <video id="video" autoplay playsinline muted tabindex="0" style="display:none"></video>

    <div id="overlay">
      <div class="overlay-box">
        <div class="spinner"></div>
        <h2 id="ov-title">Connecting…</h2>
        <p  id="ov-msg">Setting up your remote browser</p>
      </div>
    </div>

    <button id="audio-btn">🔇 Tap to enable audio</button>

    <!-- Keyboard button — visible when session is active -->
    <div id="kbd-overlay">
      <button id="kbd-btn" title="Toggle keyboard">⌨</button>
    </div>

    <div class="hint">Tap to interact &bull; Pinch/scroll &bull; ⌨ for keyboard</div>
  </div>

  <div id="statusbar">
    <span class="s-dot" id="s-dot"></span>
    <span id="s-text">Ready</span>
    <div class="s-pills">
      <span class="s-pill" id="p-ice">ICE —</span>
      <span class="s-pill" id="p-ctrl">ctrl —</span>
      <span class="s-pill" id="p-audio">audio —</span>
      <span class="s-pill" id="p-res">— × —</span>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(() => {
'use strict';

/* ── Touch-hint flash ── */
const viewport = document.getElementById('viewport');
let hintTimer = null;
function flashHint() {
  viewport.classList.add('touch-hint');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => viewport.classList.remove('touch-hint'), 1800);
}

let url_history = [];
let history_index = -1;

/* ══════════ Firebase init ══════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            'AIzaSyA4BYjOa__uKZjOBvS5p_uMxmJ6AMsKcpg',
  authDomain:        'chat1-6cc2e.firebaseapp.com',
  databaseURL:       'https://chat1-6cc2e-default-rtdb.firebaseio.com',
  projectId:         'chat1-6cc2e',
  storageBucket:     'chat1-6cc2e.firebasestorage.app',
  messagingSenderId: '771765903902',
  appId:             '1:771765903902:web:a6fb2e71b059c20ba7840f',
};
firebase.initializeApp(FIREBASE_CONFIG);
const db   = firebase.database();
const auth = firebase.auth();

const SESSION_ROOT  = 'remoteBrowser/sessions';
const DEFAULT_URL   = 'https://home.voidbase.uk';
const DEFAULT_CAP   = { w:1920, h:1080, fps:30, vw:1920, vh:1080 };

/* ══════════ Persistent identity ════════════════════════════════════════ */
const IDENTITY_KEY = '__rb_identity';
function getStoredIdentity() {
  try { return JSON.parse(localStorage.getItem(IDENTITY_KEY) || 'null'); } catch { return null; }
}
function setStoredIdentity(uid) {
  try { localStorage.setItem(IDENTITY_KEY, JSON.stringify({ uid, createdAt: Date.now() })); } catch {}
}

let _uid = null;
function sk(key) { return `rb:${_uid || 'pre'}:${key}`; }
function uSet(k, v) { try { localStorage.setItem(sk(k), JSON.stringify(v)); } catch {} }
function uGet(k, fb) {
  try { const v = localStorage.getItem(sk(k)); return v === null ? fb : JSON.parse(v); }
  catch { return fb; }
}

/* ══════════ DOM refs ════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const el = {
  splash:   $('splash'),
  video:    $('video'),
  overlay:  $('overlay'),
  ovTitle:  $('ov-title'),
  ovMsg:    $('ov-msg'),
  urlInput: $('url-input'),
  btnBack:  $('btn-back'),
  btnFwd:   $('btn-forward'),
  btnRel:   $('btn-reload'),
  btnClose: $('btn-close'),
  lock:     $('lock'),
  idDot:    $('id-dot'),
  idLabel:  $('id-label'),
  sDot:     $('s-dot'),
  sText:    $('s-text'),
  pIce:     $('p-ice'),
  pCtrl:    $('p-ctrl'),
  pAudio:   $('p-audio'),
  pRes:     $('p-res'),
  audioBtn: $('audio-btn'),
  toasts:   $('toasts'),
  viewport: $('viewport'),
  kbdTrigger: $('kbd-trigger'),
  kbdOverlay: $('kbd-overlay'),
  kbdBtn:     $('kbd-btn'),
};

/* ══════════ Toast / log ═════════════════════════════════════════════ */
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  el.toasts.appendChild(t);
  setTimeout(() => t.remove(), 3100);
}
function log(...args) { console.log('[rb]', ...args); }

/* ══════════ Session state ══════════════════════════════════════════ */
const S = {
  uid:           null,
  sessionId:     null,
  sessionRef:    null,
  sessionSub:    null,
  pc:            null,
  ctrl:          null,
  stream:        null,
  capture:       { ...DEFAULT_CAP },
  connState:     'idle',
  iceState:      'idle',
  ctrlState:     'none',
  audioState:    'wait',
  remoteDescSet: false,
  negotiating:   false,
  answerSent:    false,
  seenSrvCands:  new Set(),
  pendingSrvCands: [],
  authReady:     null,
  kbdVisible:    false,
};

/* ══════════ UI helpers ══════════════════════════════════════════════ */
function setOverlay(title, msg, show) {
  el.ovTitle.textContent = title;
  el.ovMsg.textContent   = msg;
  el.overlay.classList.toggle('show', show);
}
function showVideo() {
  el.splash.classList.add('hidden');
  el.video.style.display = 'block';
  el.kbdOverlay.classList.add('show');
}
function showSplash() {
  el.splash.classList.remove('hidden');
  el.video.style.display = 'none';
  el.video.srcObject = null;
  el.urlInput.value = '';
  updateLock('');
  el.kbdOverlay.classList.remove('show');
  S.kbdVisible = false;
}
function updateStatus() {
  const conn = S.connState;
  el.sDot.className = 's-dot' + (conn === 'connected' ? ' good' : conn === 'failed' || conn === 'closed' ? ' bad' : conn !== 'idle' ? ' warn' : '');
  el.sText.textContent = conn;
  el.pIce.textContent  = 'ICE ' + S.iceState;
  el.pCtrl.textContent = 'ctrl ' + S.ctrlState;
  el.pAudio.textContent = 'audio ' + S.audioState;
  const c = S.capture;
  el.pRes.textContent  = c.w + '×' + c.h;
  const ctrlOpen = S.ctrl && S.ctrl.readyState === 'open';
  el.btnRel.disabled   = !ctrlOpen;
  el.btnClose.disabled = !S.sessionId;
}
function updateLock(url) {
  if (!url) { el.lock.textContent = '🔒'; el.lock.style.color = 'var(--text-muted)'; return; }
  el.lock.textContent = url.startsWith('https') ? '🔒' : '⚠️';
  el.lock.style.color = url.startsWith('https') ? 'var(--good)' : 'var(--warn)';
}
function setIdentityUI(uid) {
  el.idLabel.textContent = uid.slice(0, 8) + '…';
  el.idDot.className = 'dot good';
}

/* ══════════ iPad keyboard handling ════════════════════════════════
   iOS does not fire keydown on a <video> element.
   Solution: maintain a hidden <input> that captures keyboard input
   and translates each keystroke to a control-channel message.
   The ⌨ button toggles the software keyboard by focusing/blurring
   the hidden input.
══════════════════════════════════════════════════════════════════ */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

el.kbdBtn.addEventListener('click', () => {
  if (S.kbdVisible) {
    el.kbdTrigger.blur();
    S.kbdVisible = false;
  } else {
    el.kbdTrigger.focus();
    S.kbdVisible = true;
  }
});

el.kbdTrigger.addEventListener('blur', () => { S.kbdVisible = false; });

// Forward keystrokes from the hidden input — stop propagation so
// the global window keydown handler doesn't also fire
el.kbdTrigger.addEventListener('keydown', ev => {
  ev.stopPropagation();
  if (!S.sessionId) return;
  if (ev.key === 'Escape') { el.kbdTrigger.blur(); return; }
  ev.preventDefault();
  send(keyPayload(ev, 'down'));
});
el.kbdTrigger.addEventListener('keyup', ev => {
  ev.stopPropagation();
  if (!S.sessionId) return;
  ev.preventDefault();
  send(keyPayload(ev, 'up'));
});

// iOS virtual keyboard fires 'input' for printable chars
el.kbdTrigger.addEventListener('input', ev => {
  ev.stopPropagation();
  if (!S.sessionId) return;
  const val = el.kbdTrigger.value;
  if (!val) return;
  for (const ch of val) {
    send({ type: 'key', action: 'down', key: ch, code: '', text: ch,
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
    send({ type: 'key', action: 'up',   key: ch, code: '', text: ch,
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
  }
  el.kbdTrigger.value = '';
});

// Backspace and Enter from iOS virtual keyboard
el.kbdTrigger.addEventListener('beforeinput', ev => {
  ev.stopPropagation();
  if (!S.sessionId) return;
  if (ev.inputType === 'deleteContentBackward') {
    ev.preventDefault();
    send({ type: 'key', action: 'down', key: 'Backspace', code: 'Backspace', text: '',
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
    send({ type: 'key', action: 'up', key: 'Backspace', code: 'Backspace', text: '',
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
  }
  if (ev.inputType === 'insertLineBreak') {
    ev.preventDefault();
    send({ type: 'key', action: 'down', key: 'Enter', code: 'Enter', text: '',
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
    send({ type: 'key', action: 'up', key: 'Enter', code: 'Enter', text: '',
           altKey:false, ctrlKey:false, metaKey:false, shiftKey:false, repeat:false, isKeypad:false });
  }
});

/* ══════════ Audio ═══════════════════════════════════════════════════ */
function tryUnmute() {
  if (!el.video.muted) return;
  el.video.muted = false;
  el.video.play().then(() => {
    el.audioBtn.classList.remove('show');
    S.audioState = 'live';
    updateStatus();
  }).catch(() => {
    el.video.muted = true;
    el.video.play().catch(() => {});
    S.audioState = 'blocked';
    updateStatus();
    el.audioBtn.classList.add('show');
  });
}

el.audioBtn.addEventListener('click', () => {
  el.video.muted = false;
  el.video.play().catch(() => {});
  el.audioBtn.classList.remove('show');
  S.audioState = 'live';
  updateStatus();
  toast('Audio enabled', 'ok');
});

el.viewport.addEventListener('pointerdown', () => { if (S.sessionId) tryUnmute(); }, { passive: true });

/* ══════════ Scroll via touch (iOS wheel fallback) ═══════════════════
   iOS Safari does not fire 'wheel' events on elements with
   touch-action:none. We capture touchmove on the video and send
   scroll deltas manually.
════════════════════════════════════════════════════════════════════ */
let _lastTouchY = null;
let _lastTouchX = null;
let _touchScrollTimer = null;
const SCROLL_THROTTLE_MS = 16; // ~60fps

el.video.addEventListener('touchstart', ev => {
  if (ev.touches.length === 1) {
    _lastTouchX = ev.touches[0].clientX;
    _lastTouchY = ev.touches[0].clientY;
  }
}, { passive: true });

el.video.addEventListener('touchmove', ev => {
  ev.preventDefault(); // Prevent page scroll
  if (ev.touches.length !== 1 || _lastTouchY === null) return;
  if (_touchScrollTimer) return; // throttle
  _touchScrollTimer = setTimeout(() => { _touchScrollTimer = null; }, SCROLL_THROTTLE_MS);

  const dx = ev.touches[0].clientX - _lastTouchX;
  const dy = ev.touches[0].clientY - _lastTouchY;
  _lastTouchX = ev.touches[0].clientX;
  _lastTouchY = ev.touches[0].clientY;

  const c = remoteCoords(ev.touches[0]);
  if (c) {
    // Invert: drag down = scroll up content (natural scroll)
    send({ type:'mouse', action:'wheel', button:'none', deltaX: -dx * 2, deltaY: -dy * 2, x: c.x, y: c.y });
  }
}, { passive: false });

el.video.addEventListener('touchend', () => { _lastTouchX = null; _lastTouchY = null; }, { passive: true });

/* ══════════ Coordinate translation ═════════════════════════════════ */
function remoteCoords(ev) {
  const r   = el.video.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const c   = S.capture;
  const fw  = c.w || DEFAULT_CAP.w;
  const fh  = c.h || DEFAULT_CAP.h;
  const vpW = c.vw || fw;
  const vpH = c.vh || fh;
  const sc  = Math.min(r.width / fw, r.height / fh);
  if (!isFinite(sc) || sc <= 0) return null;
  const cw  = fw * sc;
  const ch  = fh * sc;
  const ox  = (r.width  - cw) / 2;
  const oy  = (r.height - ch) / 2;
  const lx  = ev.clientX - r.left - ox;
  const ly  = ev.clientY - r.top  - oy;
  if (lx < 0 || ly < 0 || lx > cw || ly > ch) return null;
  return { x: Math.round((lx / cw) * vpW), y: Math.round((ly / ch) * vpH) };
}

/* ══════════ Control channel ════════════════════════════════════════ */
function send(payload) {
  if (S.ctrl && S.ctrl.readyState === 'open') {
    S.ctrl.send(JSON.stringify(payload));
    return true;
  }
  return false;
}

function focusRemote() {
  el.video.focus({ preventScroll: true });
  send({ type: 'focus' });
  tryUnmute();
  flashHint();
}

function keyPayload(ev, action) {
  return {
    type: 'key', action,
    key: ev.key, code: ev.code,
    text: ev.key?.length === 1 ? ev.key : '',
    altKey: ev.altKey, ctrlKey: ev.ctrlKey, metaKey: ev.metaKey, shiftKey: ev.shiftKey,
    repeat: ev.repeat,
    isKeypad: ev.location === KeyboardEvent.DOM_KEY_LOCATION_NUMPAD,
  };
}
function btnName(ev) { return ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left'; }

/* ══════════ Inbound data channel messages ══════════════════════════ */
function handleHostMessage(msg) {
  if (!msg || typeof msg !== 'object') return;
  switch (msg.type) {
    case 'urlChange':
      if (msg.url) {
        el.urlInput.value = msg.url;
        updateLock(msg.url);
        uSet('lastUrl', msg.url);
        pushHistory(msg.url);
      }
      break;
    case 'captureInfo':
      if (msg.capture) {
        S.capture = {
          w:  msg.capture.w  || DEFAULT_CAP.w,
          h:  msg.capture.h || DEFAULT_CAP.h,
          fps: msg.capture.fps || DEFAULT_CAP.fps,
          vw:  msg.capture.vw  || msg.capture.width  || DEFAULT_CAP.vw,
          vh:  msg.capture.vh || msg.capture.height || DEFAULT_CAP.vh,
        };
        updateStatus();
      }
      break;
    case 'title':
      if (msg.title) document.title = `Remote Browser — ${msg.title}`;
      break;
    case 'pong':
      break;
    default:
      log('unknown host msg:', msg.type);
  }
}

/* ══════════ WebRTC peer connection ════════════════════════════════ */
function setupPC() {
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  S.pc     = pc;
  S.stream = new MediaStream();

  pc.ontrack = ev => {
    const track = ev.track;
    if (track && !S.stream.getTracks().some(t => t.id === track.id)) S.stream.addTrack(track);
    if (track?.kind === 'audio') { S.audioState = 'live'; updateStatus(); }
    if (el.video.srcObject !== S.stream) {
      el.video.srcObject = S.stream;
      el.video.muted = true;
      el.video.play().then(() => {
        showVideo();
        el.overlay.classList.remove('show');
        setTimeout(tryUnmute, 200);
      }).catch(() => {
        showVideo();
        el.overlay.classList.remove('show');
      });
    }
  };

  pc.onicecandidate = async ev => {
    if (!ev.candidate || !S.sessionRef) return;
    try { await S.sessionRef.child('cc').push(ev.candidate.toJSON()); }
    catch (e) { log('client ICE push:', e.message); }
  };

  pc.ondatachannel = ev => {
    if (ev.channel.label !== 'control') return;
    S.ctrl = ev.channel;
    ev.channel.onopen  = () => {
      S.ctrlState = 'open';
      updateStatus();
      toast('Connected!', 'ok');
      send({ type: 'ping' });
    };
    ev.channel.onclose = () => { S.ctrlState = 'closed'; updateStatus(); };
    ev.channel.onmessage = ev2 => {
      try { handleHostMessage(JSON.parse(ev2.data)); } catch {}
    };
  };

  pc.onconnectionstatechange = () => {
    S.connState = pc.connectionState;
    updateStatus();
    if (S.connState === 'failed' || S.connState === 'closed') {
      toast('Connection lost', 'err');
      cleanup(false);
    }
  };

  pc.oniceconnectionstatechange = () => { S.iceState = pc.iceConnectionState; updateStatus(); };
}

/* ══════════ Firebase session listener ══════════════════════════════ */
async function drainPendingSrvCands() {
  if (!S.pc || !S.remoteDescSet || !S.pendingSrvCands.length) return;
  const q = S.pendingSrvCands.splice(0);
  for (const c of q) {
    try { await S.pc.addIceCandidate(c); } catch (e) { log('drain ICE:', e.message); }
  }
}

function attachListener() {
  S.sessionSub = S.sessionRef.on('value', async snap => {
    const data = snap.val();
    if (!data) { cleanup(false); return; }

    if (data.capture && S.ctrlState !== 'open') {
      S.capture = {
        w:  data.capture.w  || DEFAULT_CAP.w,
        h:  data.capture.h || DEFAULT_CAP.h,
        fps: data.capture.fps || DEFAULT_CAP.fps,
        vw:  data.capture.vw  || data.capture.width  || DEFAULT_CAP.vw,
        vh:  data.capture.vh || data.capture.height || DEFAULT_CAP.vh,
      };
      updateStatus();
    }
    if (data.url && S.ctrlState !== 'open') {
      el.urlInput.value = data.url;
      updateLock(data.url);
    }

    const waiting = ['pending','launch','wait-answer','offer-ready'].includes(data.status);
    if (data.status) {
      const labels = {
        pending:        ['Waiting for host', 'Remote browser is starting…'],
        launch:         ['Launching', 'Browser is starting on remote host'],
        'wait-answer':  ['Negotiating', 'Setting up WebRTC connection'],
        'offer-ready':  ['Negotiating', 'Waiting for answer from host'],
        connected:      ['Connected', 'Receiving video stream'],
        stopped:        ['Stopped', 'Session ended'],
        error:          ['Error', 'Remote host encountered an error'],
      };
      const [title, msg] = labels[data.status] || [data.status, ''];
      if (waiting) setOverlay(title, msg, true);
      else if (data.status === 'connected') el.overlay.classList.remove('show');
      else if (['stopped','deleted','error'].includes(data.status)) {
        setOverlay(title, msg, true);
        toast('Session ' + data.status, data.status === 'error' ? 'err' : 'info');
        cleanup(false);
        return;
      }
    }

    if (data.offer && S.pc && !S.remoteDescSet && !S.negotiating && !S.answerSent) {
      S.negotiating = true;
      try {
        await S.pc.setRemoteDescription(data.offer);
        S.remoteDescSet = true;
        const answer = await S.pc.createAnswer();
        await S.pc.setLocalDescription(answer);
        await S.sessionRef.update({
          answer,
          status: 'connected',
          answerSentAt: firebase.database.ServerValue.TIMESTAMP,
        });
        S.answerSent = true;
        await drainPendingSrvCands();
      } catch (e) {
        log('answer error:', e.message);
        toast('Connection setup failed', 'err');
      } finally { S.negotiating = false; }
    }

    for (const [key, cand] of Object.entries(data.sc || {})) {
      if (S.seenSrvCands.has(key)) continue;
      S.seenSrvCands.add(key);
      if (!S.remoteDescSet) { S.pendingSrvCands.push(cand); continue; }
      try { await S.pc.addIceCandidate(cand); } catch (e) { log('srv ICE:', e.message); }
    }
  });
}

/* ══════════ Start / stop session ═══════════════════════════════════ */
async function startSession(url) {
  await S.authReady;
  if (!auth.currentUser) throw new Error('Not authenticated');
  if (S.sessionId) await stopSession();

  url = (url || DEFAULT_URL).trim() || DEFAULT_URL;
  const sessionId = crypto.randomUUID();

  S.sessionId        = sessionId;
  S.remoteDescSet    = false;
  S.negotiating      = false;
  S.answerSent       = false;
  S.seenSrvCands     = new Set();
  S.pendingSrvCands  = [];
  S.connState        = 'connecting';
  S.iceState         = 'idle';
  S.ctrlState        = 'none';
  S.audioState       = 'wait';
  S.capture          = { ...DEFAULT_CAP };

  el.urlInput.value = url;
  updateLock(url);
  updateStatus();
  setOverlay('Starting…', 'Creating your session', true);

  setupPC();

  S.sessionRef = db.ref(`${SESSION_ROOT}/${sessionId}`);
  attachListener();

  await S.sessionRef.set({
    id: sessionId, url,
    requestedBy: auth.currentUser.uid,
    status: 'pending',
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    client: {
      uid: auth.currentUser.uid,
      userAgent: navigator.userAgent,
      viewport: { width: innerWidth, height: innerHeight },
    },
  });

  uSet('lastUrl', url);
  toast('Session started', 'ok');
}

async function stopSession() {
  if (!S.sessionId) return;
  const ref = S.sessionRef;
  const id  = S.sessionId;
  cleanup(false);
  if (ref) {
    try {
      await ref.update({
        status: 'stopped',
        stoppedAt: firebase.database.ServerValue.TIMESTAMP,
        stopReason: 'client-close',
        offer: null, answer: null, cc: null, sc: null,
      });
    } catch {}
    setTimeout(async () => {
      const writes = {};
      writes[`${SESSION_ROOT}/${id}`] = null;
      writes[`remoteBrowser/signaling/${id}`] = null;
      try { await db.ref().update(writes); } catch {}
    }, 600);
  }
}

function cleanup(doShowSplash) {
  if (S.sessionSub && S.sessionRef) {
    try { S.sessionRef.off('value', S.sessionSub); } catch {}
    S.sessionSub = null;
  }
  if (S.ctrl) { try { S.ctrl.close(); } catch {} S.ctrl = null; }
  if (S.pc)   { try { S.pc.close();   } catch {} S.pc   = null; }
  if (S.stream) { S.stream.getTracks().forEach(t => { try { t.stop(); } catch {} }); S.stream = null; }

  S.sessionId = null;
  S.sessionRef = null;
  S.connState  = 'idle';
  S.iceState   = 'idle';
  S.ctrlState  = 'none';
  S.audioState = 'wait';
  S.kbdVisible = false;

  el.audioBtn.classList.remove('show');
  el.overlay.classList.remove('show');
  el.video.srcObject = null;
  el.video.muted = true;
  el.btnRel.disabled  = true;
  el.btnClose.disabled = true;
  document.title = 'Remote Browser';
  updateStatus();
  showSplash();
}

/* ══════════ Navigate ════════════════════════════════════════════════ */
function navigate(url) {
  if (url === 'https://home.voidbase.uk') url = 'https://olibot1109.github.io/home/';
  if (url && !/^https?:\/\//i.test(url) && !url.startsWith('//')) {
    url = /\.\w{2,}(\b|$)/.test(url) ? 'https://' + url : 'https://www.google.com/search?q=' + encodeURIComponent(url);
  }
  if (send({ type: 'navigate', url })) {
    el.urlInput.value = url;
    updateLock(url);
    uSet('lastUrl', url);
  } else {
    startSession(url).catch(e => toast(e.message, 'err'));
  }
}

function pushHistory(url) {
  if (!url) return;
  if (url_history[history_index] === url) return;
  url_history = url_history.slice(0, history_index + 1);
  url_history.push(url);
  history_index = url_history.length - 1;
  updateNavButtons();
}

function updateNavButtons() {
  el.btnBack.disabled = history_index <= 0;
  el.btnFwd.disabled  = history_index >= url_history.length - 1;
}

el.btnBack.addEventListener('click', () => {
  if (history_index <= 0) return;
  history_index--;
  const url = url_history[history_index];
  el.urlInput.value = url; updateLock(url); uSet('lastUrl', url);
  navigate(url); updateNavButtons();
});
el.btnFwd.addEventListener('click', () => {
  if (history_index >= url_history.length - 1) return;
  history_index++;
  const url = url_history[history_index];
  el.urlInput.value = url; updateLock(url); uSet('lastUrl', url);
  navigate(url); updateNavButtons();
});

/* ══════════ Input forwarding ════════════════════════════════════════ */
el.video.addEventListener('contextmenu', ev => ev.preventDefault());

el.video.addEventListener('pointerdown', ev => {
  if (!['mouse','pen','touch'].includes(ev.pointerType)) return;
  ev.preventDefault();
  focusRemote();
  try { el.video.setPointerCapture(ev.pointerId); } catch {}
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'down', button:btnName(ev), buttons:ev.buttons, clickCount:ev.detail||1, x:c.x, y:c.y });
});
el.video.addEventListener('pointerup', ev => {
  if (!['mouse','pen','touch'].includes(ev.pointerType)) return;
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'up', button:btnName(ev), buttons:0, clickCount:ev.detail||1, x:c.x, y:c.y });
  try { el.video.releasePointerCapture(ev.pointerId); } catch {}
});

// Throttle pointermove — iPads generate very high frequency events
let _movePending = false;
el.video.addEventListener('pointermove', ev => {
  if (!['mouse','pen','touch'].includes(ev.pointerType)) return;
  if (_movePending) return;
  _movePending = true;
  requestAnimationFrame(() => {
    _movePending = false;
    const c = remoteCoords(ev);
    if (c) send({ type:'mouse', action:'move', button:'none', buttons:ev.buttons, clickCount:0, x:c.x, y:c.y });
  });
});
el.video.addEventListener('pointercancel', ev => {
  try { el.video.releasePointerCapture(ev.pointerId); } catch {}
  _lastTouchX = null; _lastTouchY = null;
});

// Desktop wheel (non-iOS)
el.video.addEventListener('wheel', ev => {
  ev.preventDefault();
  const c = remoteCoords(ev);
  if (c) send({ type:'mouse', action:'wheel', button:'none', deltaX:ev.deltaX, deltaY:ev.deltaY, x:c.x, y:c.y });
}, { passive: false });

// Desktop keyboard (non-iOS / hardware keyboard on iPad)
function isTyping(t) { const tag=(t?.tagName||'').toLowerCase(); return tag==='input'||tag==='textarea'||t?.isContentEditable; }

window.addEventListener('keydown', ev => {
  if (!S.sessionId) return;
  if (isTyping(ev.target)) return;
  if (ev.key === 'Escape') { ev.preventDefault(); el.video.blur(); return; }
  if (ev.key === 'F5') { ev.preventDefault(); send({ type:'reload' }); return; }
  ev.preventDefault();
  focusRemote();
  send(keyPayload(ev, 'down'));
});
window.addEventListener('keyup', ev => {
  if (!S.sessionId || isTyping(ev.target)) return;
  ev.preventDefault();
  send(keyPayload(ev, 'up'));
});

/* ══════════ Chrome controls ════════════════════════════════════════ */
el.urlInput.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  el.urlInput.blur(); // dismiss iOS keyboard
  navigate(el.urlInput.value.trim() || DEFAULT_URL);
});
el.btnRel.addEventListener('click', () => send({ type: 'reload' }));
el.btnClose.addEventListener('click', () => stopSession().catch(e => log('stop error:', e.message)));

document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.addEventListener('click', () => startSession(btn.dataset.url).catch(e => toast(e.message, 'err')));
});

/* ══════════ Unload cleanup ════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  if (S.sessionRef) {
    try {
      S.sessionRef.update({
        status: 'stopped', stoppedAt: Date.now(),
        offer: null, answer: null, cc: null, sc: null,
      });
    } catch {}
  }
});

// iOS: pagehide fires more reliably than beforeunload
window.addEventListener('pagehide', () => {
  if (S.sessionRef) {
    try {
      S.sessionRef.update({
        status: 'stopped', stoppedAt: Date.now(),
        offer: null, answer: null, cc: null, sc: null,
      });
    } catch {}
  }
});

/* ══════════ Auth & boot ════════════════════════════════════════════ */
S.authReady = new Promise(resolve => {
  auth.onAuthStateChanged(async user => {
    if (user) {
      _uid = user.uid;
      const stored = getStoredIdentity();
      if (!stored || stored.uid !== user.uid) setStoredIdentity(user.uid);
      setIdentityUI(user.uid);
      S.uid = user.uid;
      log('identity ready:', user.uid.slice(0,8));
      const lastUrl = uGet('lastUrl', null);
      if (lastUrl) { el.urlInput.value = lastUrl; updateLock(lastUrl); }
      resolve();
    }
  });
  auth.signInAnonymously().catch(e => {
    toast('Auth error: ' + e.message, 'err');
    log('auth error:', e.message);
  });
});

log('boot — iPad-compatible build');
})();
