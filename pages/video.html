<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0500">
  <title>Math Practice</title>
  <link rel="icon" type="image/png" href="/imgs/image.png">
  <script src="/script.js"></script>
  <script src="https://www.google.com/recaptcha/api.js?render=6LdbVcMrAAAAANpTUNdcbxt16-1W6_GpH2FjnXaw"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0500;
      color: rgba(255,255,255,0.85);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 0;
    }

    /* Streaming tint overlay */
    .streaming-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(251,146,60,0.06) 0%, transparent 100%);
      pointer-events: none; z-index: -1; display: none;
    }
    body.streaming .streaming-bg { display: block; }

    /* ── Nav ──────────────────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px;
      background: rgba(10,5,0,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(251,146,60,0.08);
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 700; color: #fff;
      text-decoration: none; flex-shrink: 0;
    }
    .nav-logo img { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; }
    .nav-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.08); flex-shrink: 0; margin: 0 2px; }
    .nav-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); flex-shrink: 0; }
    .nav-spacer { flex: 1; }
    .nav-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(40,15,4,0.6); border: 1px solid rgba(251,146,60,0.16);
      border-radius: 999px; padding: 5px 12px;
      font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);
      cursor: pointer; text-decoration: none; transition: all 0.15s;
      font-family: inherit; white-space: nowrap; flex-shrink: 0;
    }
    .nav-chip:hover { background: rgba(70,28,6,0.75); border-color: rgba(251,146,60,0.38); color: rgba(255,255,255,0.9); }
    .nav-chip svg { width: 12px; height: 12px; flex-shrink: 0; opacity: 0.8; }

    /* ── Page ─────────────────────────────────────────────────────────────── */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 80px 18px 60px;
    }

    /* ── Section headings ─────────────────────────────────────────────────── */
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: rgba(251,146,60,0.55);
      margin-bottom: 10px; margin-top: 22px;
    }

    /* ── Private room controls ────────────────────────────────────────────── */
    .room-code-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    #room-code-input {
      background: rgba(18,7,1,0.9);
      border: 1px solid rgba(251,146,60,0.18);
      border-radius: 8px; padding: 7px 12px;
      color: rgba(255,255,255,0.9); font-size: 13px;
      outline: none; transition: border-color 0.15s;
      font-family: inherit;
    }
    #room-code-input:focus { border-color: rgba(251,146,60,0.5); }
    #room-code-input::placeholder { color: rgba(255,255,255,0.3); }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 13px; border-radius: 8px;
      background: rgba(30,12,3,0.85); border: 1px solid rgba(251,146,60,0.2);
      color: rgba(255,255,255,0.75); cursor: pointer;
      font-size: 13px; font-family: inherit; transition: all 0.15s;
    }
    .btn:hover { background: rgba(50,20,5,0.9); border-color: rgba(251,146,60,0.45); color: #fff; }
    .btn.danger { background: rgba(60,10,10,0.8); border-color: rgba(239,68,68,0.3); color: rgba(239,68,68,0.8); }
    .btn.danger:hover { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.6); color: #ef4444; }
    .btn.home { display: none; } /* replaced by nav */

    /* ── Name bar ─────────────────────────────────────────────────────────── */
    .name-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 0 16px;
    }
    .name-bar label { font-size: 12px; color: rgba(255,255,255,0.35); }
    #my-display-name {
      background: rgba(18,7,1,0.9);
      border: 1px solid rgba(251,146,60,0.18);
      border-radius: 8px; padding: 6px 12px;
      color: rgba(255,255,255,0.9); font-size: 13px;
      outline: none; transition: border-color 0.15s;
      font-family: inherit; width: 180px;
    }
    #my-display-name:focus { border-color: rgba(251,146,60,0.5); }
    #my-display-name::placeholder { color: rgba(255,255,255,0.28); }

    /* Share link button */
    #share-room-btn {
      display: none; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 8px;
      background: rgba(251,146,60,0.12); border: 1px solid rgba(251,146,60,0.35);
      color: rgba(251,146,60,0.9); cursor: pointer; font-size: 12px; font-family: inherit;
      transition: all 0.15s;
    }
    #share-room-btn:hover { background: rgba(251,146,60,0.2); border-color: rgba(251,146,60,0.6); }

    /* ── Room cards ───────────────────────────────────────────────────────── */
    .rooms {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .room {
      background: rgba(14,6,1,0.85);
      border: 1px solid rgba(251,146,60,0.12);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .room:hover { border-color: rgba(251,146,60,0.28); }
    .room.active {
      background: rgba(251,146,60,0.08);
      border-color: rgba(251,146,60,0.5);
      box-shadow: 0 0 0 1px rgba(251,146,60,0.2);
    }
    .room-status {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.18); margin-right: 4px;
      transition: background 0.3s;
    }
    .room-status.has-users { background: #4ade80; }
    .room h3 { margin: 0 0 6px; font-size: 14px; color: rgba(255,255,255,0.85); }
    .room .count { color: rgba(255,255,255,0.35); font-size: 12px; }
    .room .muted { color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 4px; }

    /* ── Video grid ───────────────────────────────────────────────────────── */
    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    body.in-call .videos { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    video {
      width: 100%; height: 160px;
      background: #050200; border-radius: 10px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.05);
      transition: border-color 0.2s;
    }
    video.speaking { border-color: #fb923c; }
    body.in-call video { height: 280px; }

    /* ── Media control row ────────────────────────────────────────────────── */
    .controls-row {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-bottom: 18px;
    }

    /* ── Chat section ─────────────────────────────────────────────────────── */
    .chat {
      background: rgba(12,5,0,0.75);
      border: 1px solid rgba(251,146,60,0.1);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .chat-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .chat-top h3 {
      margin: 0; font-size: 14px; font-weight: 600;
      color: rgba(255,255,255,0.85);
      display: flex; align-items: center; gap: 7px;
    }
    .chat-top h3::before { content: '💬'; font-size: 0.9em; }
    .chat-sub { margin-top: 3px; color: rgba(255,255,255,0.3); font-size: 12px; }
    .chat-room-pill {
      padding: 4px 11px; border-radius: 999px;
      background: rgba(25,10,2,0.8); border: 1px solid rgba(251,146,60,0.2);
      color: rgba(251,146,60,0.7); font-size: 12px; white-space: nowrap;
    }
    .chat-messages {
      max-height: 360px; overflow-y: auto;
      padding: 12px 14px;
      scrollbar-width: thin; scrollbar-color: rgba(251,146,60,0.18) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(251,146,60,0.18); border-radius: 4px; }
    .chat-empty {
      padding: 18px; border-radius: 10px;
      background: rgba(15,6,0,0.8); border: 1px dashed rgba(251,146,60,0.14);
      color: rgba(255,255,255,0.3); font-size: 13px; line-height: 1.5;
    }
    .chat-message {
      display: flex; gap: 10px; margin-bottom: 10px;
      background: rgba(18,7,1,0.8);
      border: 1px solid rgba(255,255,255,0.04);
      padding: 9px 12px; border-radius: 10px; position: relative;
    }
    .chat-message.self {
      background: rgba(251,146,60,0.07);
      border-color: rgba(251,146,60,0.15); margin-left: 16px;
    }
    .chat-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(251,146,60,0.2);
      display: flex; align-items: center; justify-content: center;
      flex: 0 0 36px; font-weight: 700; color: rgba(251,146,60,0.9);
      letter-spacing: 0.03em; font-size: 12px;
    }
    .chat-message.self .chat-avatar { background: rgba(251,146,60,0.15); }
    .chat-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .chat-content { flex: 1; min-width: 0; }
    .chat-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .chat-name { font-weight: 600; color: #fb923c; font-size: 13px; }
    .chat-message.self .chat-name { color: rgba(251,180,100,0.9); }
    .chat-time { font-size: 11px; color: rgba(255,255,255,0.28); }
    .chat-text { margin-top: 4px; word-break: break-word; color: rgba(255,255,255,0.8); font-size: 13px; line-height: 1.45; }
    .chat-location { margin-top: 6px; }
    .chat-input {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 14px;
      border-top: 1px solid rgba(255,255,255,0.04);
      background: rgba(10,4,0,0.5);
    }
    .chat-input input {
      flex: 1; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(251,146,60,0.18);
      background: rgba(15,6,0,0.9); color: rgba(255,255,255,0.9);
      font-size: 13px; outline: none; transition: border-color 0.15s;
      font-family: inherit;
    }
    .chat-input input:focus { border-color: rgba(251,146,60,0.5); }
    .chat-input input::placeholder { color: rgba(255,255,255,0.28); }
    .chat-input button {
      padding: 8px 16px; border: none; border-radius: 8px;
      background: rgba(251,146,60,0.85); color: #fff;
      cursor: pointer; font-weight: 700; font-size: 13px;
      transition: background 0.15s; font-family: inherit;
    }
    .chat-input button:hover { background: #fb923c; }

    /* Location card shared styles */
    .location-card {
      margin-top: 6px; padding: 10px;
      background: rgba(10,4,0,0.8); border-radius: 10px;
      border: 1px solid rgba(251,146,60,0.18);
    }
    .location-map { width: 100%; height: 160px; border: 0; border-radius: 8px; margin-top: 8px; }
    .location-meta { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.4; }
    .location-link { color: rgba(251,146,60,0.8); text-decoration: none; }
    .location-link:hover { color: #fb923c; text-decoration: underline; }

    /* ── Logs ─────────────────────────────────────────────────────────────── */
    .logs-toggle { cursor: pointer; user-select: none; }
    .logs-toggle:hover { color: rgba(251,146,60,0.85); }
    .logs {
      display: none;
      background: rgba(6,2,0,0.8);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 160px; overflow: auto;
      font-size: 11px; color: rgba(255,255,255,0.3);
      font-family: ui-monospace, monospace;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
  </style>
</head>

<body>
  <div class="streaming-bg"></div>

  <nav>
    <a href="/" class="nav-logo">
      <img src="/imgs/image.png" alt="Paper Stars">
      <span>Paper Stars</span>
    </a>
    <div class="nav-sep"></div>

    <div class="nav-spacer"></div>
    <a href="/pages/chat.html" class="nav-chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

  <div class="container">

    <!-- Display name -->
    <div class="name-bar">
      <label for="my-display-name">Your name</label>

    <!-- Private room controls -->
    <div class="section-title">Join or Create a Room</div>
    <div class="room-code-row">
      <input id="room-code-input" type="text" placeholder="Enter room code…">
      <button id="room-create" class="btn">➕ Create Room</button>
      <button id="room-join-code" class="btn">🔑 Join by Code</button>
    </div>

      <button id="btn-mic" class="btn">🎤 Toggle Mic</button>

      <button id="btn-switch-cam" class="btn">🔄 Switch Camera</button>
      <button id="btn-screen" class="btn">🖥️ Share Screen</button>

        <div>
          <h3>Chat</h3>
          <div class="chat-sub">Room messages and location cards live here.</div>
        </div>
        <div id="chat-room-pill" class="chat-room-pill">No room joined</div>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input">
        <input id="chat-input" type="text" placeholder="Type a message…">
        <button id="chat-send">Send</button>
      </div>

    <div class="section-title logs-toggle" id="logs-toggle">Connection Logs <span id="logs-arrow" style="font-size:9px;opacity:0.5;margin-left:4px">▶</span></div>
    <div id="logs" class="logs"></div>
  </div>

<script>
(function(){
  const logsEl = () => document.getElementById('logs');
  function log(msg, level='info'){
    try{ const el = logsEl(); if(el){ const p = document.createElement('div'); p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`; el.prepend(p); }}catch(e){}
    if(level==='error') console.error(msg); else console.log(msg);
  }

  window.addEventListener('error', e => log('Window error: '+(e?.message||'Unknown error'),'error'));
  window.addEventListener('unhandledrejection', e => log('Unhandled rejection: '+(e?.reason||e),'error'));

  if(typeof firebase === 'undefined' || !firebase.apps){
    log('Firebase library not loaded.','error'); return;
  }

  const firebaseConfig = {
    apiKey: "AIzaSyA4BYjOa__uKZjOBvS5p_uMxmJ6AMsKcpg",
    authDomain: "chat1-6cc2e.firebaseapp.com",
    databaseURL: "https://chat1-6cc2e-default-rtdb.firebaseio.com",
    projectId: "chat1-6cc2e",
    storageBucket: "chat1-6cc2e.firebasestorage.app",
    messagingSenderId: "771765903902",
    appId: "1:771765903902:web:a6fb2e71b059c20ba7840f"
  };
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  const db = firebase.database();

  firebase.auth().signInAnonymously().then(()=> log('Signed in anonymously')).catch(err=> log('Auth error: '+err.message, 'error'));

  const roomsContainer = document.getElementById('rooms');
  const videosContainer = document.getElementById('videos');
  const chatMessagesEl = document.getElementById('chat-messages');
  const chatRoomPillEl = document.getElementById('chat-room-pill');
  const chatInputEl = document.getElementById('chat-input');
  const chatSendBtn = document.getElementById('chat-send');
  const switchCamBtn = document.getElementById('btn-switch-cam');
  const sendLocationButton = document.getElementById('btn-send-location');
  const ROOM_NAMES = ['VC1','VC2','VC3','VC4','VC5','VC6','VC7','VC8','VC9','VC10'];
  const uid = Math.random().toString(36).slice(2);
  const nameInput = document.getElementById('my-display-name');
  const shareBtn = document.getElementById('share-room-btn');
  function myDisplayName() { return nameInput.value.trim() || 'Anonymous'; }
  let localStream=null,screenStream=null,currentRoom=null,roomRef=null,heartbeatInterval=null,audioContext=null;
  const peers={},analysers={};
  let micEnabled=true,soundEnabled=true,videoEnabled=true,screenSharing=false;
  let facingMode='user';

  function videoConstraints(mode){
    const constraints = { width: 320, height: 180, frameRate: 60 };
    if(mode) constraints.facingMode = { ideal: mode };
    return constraints;
  }

  async function acquireCameraStream(mode = facingMode){
    const videoStream = await navigator.mediaDevices.getUserMedia({
      video: videoConstraints(mode),
      audio: !localStream
    });

    const videoTrack = videoStream.getVideoTracks()[0];
    const audioTracks = localStream ? localStream.getAudioTracks() : videoStream.getAudioTracks();
    const stream = new MediaStream([
      ...audioTracks,
      ...(videoTrack ? [videoTrack] : [])
    ]);

    videoEnabled = true;
    facingMode = mode;
    return { stream, videoTrack };
  }

  function buildMapEmbedUrl(lat, lon){
    const delta = 0.008;
    const left = lon - delta;
    const right = lon + delta;
    const top = lat + delta;
    const bottom = lat - delta;
    return `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(left)},${encodeURIComponent(bottom)},${encodeURIComponent(right)},${encodeURIComponent(top)}&layer=mapnik&marker=${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;
  }

  function buildLocationHtml(location){
    const { lat, lon, place } = location;
    const coords = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    const placeHtml = place ? `<div class="location-meta"><strong>Place:</strong> ${place.replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}</div>` : '';
    const mapUrl = buildMapEmbedUrl(lat, lon);
    return `
      <div class="location-card">
        <div class="location-meta"><strong>Coords:</strong> ${coords}</div>
        ${placeHtml}
        <iframe class="location-map" loading="lazy" src="${mapUrl}" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div class="location-meta" style="margin-top:6px;">
          <a class="location-link" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(lat)}&mlon=${encodeURIComponent(lon)}#map=18/${encodeURIComponent(lat)}/${encodeURIComponent(lon)}" target="_blank" rel="noopener">Open full map</a>
        </div>
      </div>
    `;
  }

  function escapeHTML(text){
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function getSenderName(msg){
    if(msg.from === uid) return myDisplayName();
    if(msg.name) return msg.name;
    if(msg.from) return `User ${String(msg.from).slice(0, 6)}`;
    return 'Unknown';
  }

  function getSenderAvatar(msg){
    const name = getSenderName(msg).trim();
    if(!name) return '?';
    const parts = name.split(/\s+/).filter(Boolean);
    const initials = parts.slice(0, 2).map(part => part[0]).join('');
    return initials.toUpperCase().slice(0, 2);
  }

  function buildChatMessage(msg){
    const name = getSenderName(msg);
    const time = msg.ts ? new Date(msg.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const avatar = getSenderAvatar(msg);
    const isSelf = msg.from === uid;
    let body = '';

    if(msg.type === 'location' && msg.location){
      body = `<div class="chat-location">${buildLocationHtml(msg.location)}</div>`;
    } else if(msg.text){
      body = `<div class="chat-text">${escapeHTML(msg.text)}</div>`;
    } else {
      body = `<div class="chat-text" style="color:rgba(255,255,255,0.25)">Unsupported message</div>`;
    }

    return `
      <div class="chat-message ${isSelf ? 'self' : ''}">
        <div class="chat-avatar" aria-hidden="true">${escapeHTML(avatar)}</div>
        <div class="chat-content">
          <div class="chat-head">
            <span class="chat-name">${escapeHTML(name)}</span>
            <span class="chat-time">${escapeHTML(time)}</span>
          </div>
          ${body}
        </div>
      </div>
    `;
  }

  function setChatRoomLabel(roomName){
    if(!chatRoomPillEl) return;
    chatRoomPillEl.textContent = roomName ? `Room: ${roomName}` : 'No room joined';
  }

  function showEmptyChatState(text){
    if(!chatMessagesEl) return;
    chatMessagesEl.innerHTML = `<div class="chat-empty">${escapeHTML(text)}</div>`;
  }

  function clearEmptyChatState(){
    const empty = chatMessagesEl.querySelector('.chat-empty');
    if(empty) empty.remove();
  }

  function scrollChatToBottom(){
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function isChatNearBottom(){
    return chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight < 120;
  }

  function formatLocationLabel(lat, lon, place){
    if(place) return place;
    return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  }

  async function fetchReverseLocation(lat, lon){
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
    const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if(!response.ok) throw new Error(`Location lookup failed (${response.status})`);
    const data = await response.json();
    return data?.display_name || data?.name || '';
  }

  async function getPreciseLocation(){
    if(!navigator.geolocation){
      throw new Error('This browser does not support location.');
    }

    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    });

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    let place = '';
    try{
      place = await fetchReverseLocation(lat, lon);
    }catch(err){
      place = '';
    }
    return { lat, lon, place };
  }

  async function sendMyLocation(){
    if(!currentRoom) {
      log('Join a room first before sending location');
      return;
    }

    try{
      const location = await getPreciseLocation();
      db.ref('chat/'+currentRoom).push({
        from: uid,
        type: 'location',
        location,
        ts: Date.now()
      });
      log('Sent location');
    }catch(err){
      log('Location permission denied');
    }
  }

  function setupSpeechDetection(video, audioTrack){
    if(!audioTrack) return;
    if(!audioContext) audioContext=new AudioContext();
    const source=audioContext.createMediaStreamSource(new MediaStream([audioTrack]));
    const analyser=audioContext.createAnalyser();
    analyser.fftSize=256;
    source.connect(analyser);
    analysers[video.id]=analyser;
    const checkVolume=()=>{
      const dataArray=new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      const avg=dataArray.reduce((a,b)=>a+b)/dataArray.length;
      video.classList.toggle('speaking',avg>5);
    };
    setInterval(checkVolume,100);
  }

  const STUN_SERVERS={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

  // render public rooms
  ROOM_NAMES.forEach(name=> renderRoomBox(name,true));

  function renderRoomBox(name,isPublic=false){
    const box=document.createElement('div'); box.className='room'; box.id=`room-box-${name}`;
    const titleRow=document.createElement('div'); titleRow.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:5px';
    const statusDot=document.createElement('span'); statusDot.className='room-status'; statusDot.id=`status-${name}`;
    const title=document.createElement('h3'); title.style.margin='0'; title.textContent=name;
    titleRow.appendChild(statusDot); titleRow.appendChild(title); box.appendChild(titleRow);
    const count=document.createElement('div'); count.className='count'; count.id=`count-${name}`; count.textContent='0 connected'; box.appendChild(count);
    const btnDiv=document.createElement('div'); btnDiv.style.cssText='display:flex;gap:4px;justify-content:center;margin-top:9px';
    const joinBtn=document.createElement('button'); joinBtn.className='btn'; joinBtn.id=`join-${name}`; joinBtn.textContent='Join'; btnDiv.appendChild(joinBtn);
    const leaveBtn=document.createElement('button'); leaveBtn.className='btn danger'; leaveBtn.textContent='Leave'; btnDiv.appendChild(leaveBtn);
    box.appendChild(btnDiv);
    roomsContainer.appendChild(box);

    const rref=db.ref('vcRooms/'+name);
    rref.on('value',snap=>{
      const val=snap.val()||{}; const keys=Object.keys(val);
      count.textContent=keys.length + (keys.length===1?' connected':' connected');
      statusDot.classList.toggle('has-users', keys.length > 0);
    });

    joinBtn.addEventListener('click',()=>{
      document.querySelectorAll('.room').forEach(r=>r.classList.remove('active'));
      box.classList.add('active');
      joinRoom(name,isPublic);
    });
    leaveBtn.addEventListener('click',()=>{
      if(currentRoom===name){ disconnectCall(isPublic); box.classList.remove('active'); }
    });
  }

  async function ensureLocalStream(){
    if(localStream) return localStream;
    try{
      const { stream } = await acquireCameraStream(facingMode);
      localStream = stream;
    }catch(err){
      log('Camera mode fallback: '+err.message);
      const fallback = await navigator.mediaDevices.getUserMedia({video:{width:320,height:180,frameRate:60},audio:true});
      localStream = fallback;
    }
    const v=document.createElement('video'); v.autoplay=true; v.muted=true; v.playsInline=true; v.id=`local-${uid}`; v.srcObject=localStream; videosContainer.prepend(v);
    setupSpeechDetection(v, localStream.getAudioTracks()[0]);
    if(switchCamBtn) switchCamBtn.textContent = facingMode === 'environment' ? '📷 Back Camera' : '🤳 Front Camera';
    log('Local media started');
    document.body.classList.add('streaming'); return localStream;
  }

  async function replaceVideoTrackEverywhere(newTrack){
    for(const id in peers){
      const sender=peers[id].pc.getSenders().find(s=>s.track&&s.track.kind==='video');
      if(sender) await sender.replaceTrack(newTrack);
    }
    const localVideo=document.getElementById('local-'+uid);
    if(localVideo){
      localVideo.srcObject = localStream;
    }
  }

  async function joinRoom(roomName,isPublic=false){
    try{
      log('Joining room: '+roomName);
      if(currentRoom) await disconnectCall();
      await ensureLocalStream();
      currentRoom=roomName;
      setChatRoomLabel(roomName);
      // Update URL so it can be shared
      const shareUrl = new URL(window.location.href);
      shareUrl.searchParams.set('room', roomName);
      history.replaceState({}, '', shareUrl);
      // Show share button
      if (shareBtn) {
        shareBtn.style.display = 'inline-flex';
        shareBtn.onclick = () => {
          navigator.clipboard.writeText(shareUrl.href).then(() => {
            const orig = shareBtn.textContent;
            shareBtn.textContent = '✓ Copied!';
            setTimeout(() => { shareBtn.textContent = orig; }, 2000);
          }).catch(() => {});
        };
      }
      document.body.classList.add('in-call');
      const leaveBtnEl = document.getElementById('btn-leave');
      if (leaveBtnEl) leaveBtnEl.style.display = 'inline-flex';
      roomRef=db.ref('vcRooms/'+currentRoom);
      await roomRef.child(uid).set({joined:true,ts:Date.now(),lastSeen:Date.now()});
      roomRef.child(uid).onDisconnect().remove();

      if(heartbeatInterval) clearInterval(heartbeatInterval);
      heartbeatInterval=setInterval(()=>{ if(roomRef) roomRef.child(uid).update({lastSeen:Date.now()}); },5000);

      roomRef.on('value',snap=>{
        const data=snap.val()||{}; const now=Date.now();
        Object.keys(data).forEach(id=>{
          if(now-(data[id].lastSeen||0)>15000){ log('Pruning stale user: '+id); roomRef.child(id).remove(); }
        });
        if(!isPublic && Object.keys(data).length===0){ log('Deleting empty private room: '+roomName); db.ref('vcRooms/'+roomName).remove(); }
      });

      roomRef.on('child_added',snap=>{
        const otherId=snap.key; if(otherId===uid) return;
        log('Participant joined: '+otherId); connectToPeer(otherId).catch(err=>log('connectToPeer error: '+err,'error'));
      });
      roomRef.on('child_removed',snap=>{
        const otherId=snap.key; log('Participant left: '+otherId); cleanupPeer(otherId);
      });

      setupChat(isPublic);
    }catch(e){ log('joinRoom error: '+(e?.message||e),'error'); }
  }

  async function connectToPeer(otherId){
    if(!currentRoom) throw new Error('Not in a room');
    if(peers[otherId]){ log('Already connected to '+otherId); return; }
    if(!localStream) await ensureLocalStream();

    const pc=new RTCPeerConnection(STUN_SERVERS);
    localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));

    const remoteVid=document.createElement('video'); remoteVid.autoplay=true; remoteVid.playsInline=true; remoteVid.id=`remote-${otherId}`;
    let remoteAppended=false;
    pc.ontrack=e=>{ setupSpeechDetection(remoteVid, e.streams[0].getAudioTracks()[0]); remoteVid.srcObject=e.streams[0]; if(!remoteAppended){ remoteVid.style.position='relative'; const muteBtn=document.createElement('button'); muteBtn.textContent='🔇'; muteBtn.className='mute-btn'; muteBtn.style.cssText='position:absolute;top:5px;right:5px;background:rgba(0,0,0,0.7);color:white;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;'; muteBtn.addEventListener('click',()=> db.ref('chat/'+currentRoom).push({from:uid,type:'mute',target:otherId,ts:Date.now()})); videosContainer.appendChild(remoteVid); videosContainer.appendChild(muteBtn); remoteAppended=true; } };

    pc.onicecandidate=e=>{
      if(e.candidate){ db.ref(`signals/${currentRoom}/candidates/${uid}`).push(e.candidate.toJSON()); }
    };

    const sdpRef=db.ref(`signals/${currentRoom}/sdp/${otherId}/${uid}`);
    const sdpCallback=sdpRef.on('value',async snap=>{
      const data=snap.val(); if(!data) return;
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(data));
        if(data.type==='offer'){ const answer=await pc.createAnswer(); await pc.setLocalDescription(answer); await db.ref(`signals/${currentRoom}/sdp/${uid}/${otherId}`).set(answer); }
        sdpRef.remove();
      }catch(e){ log('Error handling remote SDP: '+(e?.message||e),'error'); }
    });

    const candRef=db.ref(`signals/${currentRoom}/candidates/${otherId}`);
    const candCallback=candRef.on('child_added',snap=>{
      const c=snap.val(); if(c) pc.addIceCandidate(new RTCIceCandidate(c)).catch(err=>log('ICE error: '+err,'error'));
    });

    peers[otherId]={pc,sdpRef,sdpCallback,candRef,candCallback};

    if(uid<otherId){
      const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
      await db.ref(`signals/${currentRoom}/sdp/${uid}/${otherId}`).set(offer);
    }
  }

  function cleanupPeer(otherId){
    const entry=peers[otherId]; if(!entry) return;
    try{ entry.sdpRef.off('value',entry.sdpCallback); }catch(e){}
    try{ entry.candRef.off('child_added',entry.candCallback); }catch(e){}
    try{ entry.pc.close(); }catch(e){}
    const v=document.getElementById('remote-'+otherId); if(v) { delete analysers[v.id]; v.remove(); }
    delete peers[otherId];
  }

  async function disconnectCall(isPublic=false){
    if(!currentRoom) return;
    if(heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval=null; }
    try{ if(roomRef) await roomRef.child(uid).remove(); }catch(e){}
    try{ await db.ref(`signals/${currentRoom}/sdp/${uid}`).remove(); }catch(e){}
    try{ await db.ref(`signals/${currentRoom}/candidates/${uid}`).remove(); }catch(e){}

    Object.keys(peers).forEach(id=>cleanupPeer(id));
    if(localStream){ localStream.getTracks().forEach(t=>t.stop()); const lv=document.getElementById('local-'+uid); if(lv) lv.remove(); localStream=null; }

    if(roomRef) roomRef.off();
    if(!isPublic){ const snap=await db.ref('vcRooms/'+currentRoom).once('value'); if(!snap.val()) db.ref('vcRooms/'+currentRoom).remove(); }

    currentRoom=null; roomRef=null;
    setChatRoomLabel(null);
    history.replaceState({}, '', window.location.pathname);
    if (shareBtn) shareBtn.style.display = 'none';
    document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
    document.body.classList.remove('streaming');
    document.body.classList.remove('in-call');
    const leaveBtnEl2 = document.getElementById('btn-leave');
    if (leaveBtnEl2) leaveBtnEl2.style.display = 'none';
  }

  // mic toggle
  document.getElementById('btn-mic').addEventListener('click',()=>{
    if(!localStream) return; micEnabled=!micEnabled;
    localStream.getAudioTracks().forEach(t=>t.enabled=micEnabled);
    document.getElementById('btn-mic').textContent = micEnabled ? '🎤 Toggle Mic' : '🔇 Muted';
  });

  // sound toggle
  document.getElementById('btn-sound').addEventListener('click',()=>{
    soundEnabled=!soundEnabled;
    document.querySelectorAll('video').forEach(v=>{ if(!v.id.startsWith('local-')) v.muted=!soundEnabled; });
    document.getElementById('btn-sound').textContent = soundEnabled ? '🔈 Toggle Sound' : '🔇 Sound Off';
  });

  // camera toggle
  document.getElementById('btn-cam').addEventListener('click',()=>{
    if(!localStream) return; videoEnabled=!videoEnabled;
    localStream.getVideoTracks().forEach(t=>t.enabled=videoEnabled);
    document.getElementById('btn-cam').textContent = videoEnabled ? '📹 Toggle Camera' : '📷 Camera Off';
    log('Camera '+(videoEnabled?'enabled':'disabled'));
  });

  // switch front/back camera
  document.getElementById('btn-switch-cam').addEventListener('click',async ()=>{
    if(!localStream) return;
    try{
      const nextMode = facingMode === 'environment' ? 'user' : 'environment';
      const oldAudioTracks = localStream.getAudioTracks();
      const oldVideoTrack = localStream.getVideoTracks()[0];
      const { videoTrack } = await acquireCameraStream(nextMode);
      localStream = new MediaStream([
        ...oldAudioTracks,
        ...(videoTrack ? [videoTrack] : [])
      ]);

      if(oldVideoTrack) oldVideoTrack.stop();
      await replaceVideoTrackEverywhere(videoTrack);

      const localVideo=document.getElementById('local-'+uid);
      if(localVideo) localVideo.srcObject = localStream;

      document.getElementById('btn-cam').textContent = videoEnabled ? '📹 Toggle Camera' : '📷 Camera Off';
      document.getElementById('btn-switch-cam').textContent = nextMode === 'environment' ? '📷 Back Camera' : '🤳 Front Camera';
      log('Switched camera to '+nextMode);
    }catch(e){
      log('Switch camera error: '+e.message,'error');
    }
  });

  // screen share toggle
  document.getElementById('btn-screen').addEventListener('click',async ()=>{
    if(!navigator.userAgent.includes('Windows')){ log('Screen sharing is only available on Windows PCs.'); return; }
    if(screenSharing){
      if(screenStream && currentRoom){
        const videoTrack=localStream.getVideoTracks()[0];
        for(let id in peers){
          const sender=peers[id].pc.getSenders().find(s=>s.track&&s.track.kind==='video');
          if(sender) await sender.replaceTrack(videoTrack);
        }
        screenStream.getTracks().forEach(t=>t.stop()); screenStream=null;
        const lv=document.getElementById('local-'+uid); if(lv) lv.srcObject=localStream;
        screenSharing=false; log('Stopped screen sharing');
      }
    }else{
      try{
        screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});
        const screenTrack=screenStream.getVideoTracks()[0];
        for(let id in peers){
          const sender=peers[id].pc.getSenders().find(s=>s.track&&s.track.kind==='video');
          if(sender) await sender.replaceTrack(screenTrack);
        }
        const lv=document.getElementById('local-'+uid); if(lv) lv.srcObject=screenStream;
        screenSharing=true; log('Started screen sharing');
        screenTrack.addEventListener('ended',()=>{ if(screenSharing) document.getElementById('btn-screen').click(); });
      }catch(e){ log('Screen share error: '+e.message,'error'); }
    }
    document.getElementById('btn-screen').textContent = screenSharing ? '🖥️ Sharing' : '🖥️ Share Screen';
  });

  function setupChat(isPublic){
    if(!currentRoom) return;
    const chatRef=db.ref('chat/'+currentRoom);
    chatRef.off();
    showEmptyChatState('No messages yet. Say hello, or send a location when you want to share where you are.');
    chatRef.on('child_added',snap=>{
      const msg=snap.val(); if(!msg) return;
      clearEmptyChatState();
      const shouldStick = isChatNearBottom();
      if(msg.type === 'mute' && msg.target === uid){
        log('Muted by ' + msg.from);
        micEnabled = false;
        if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
      }else if(msg.type === 'location' && msg.location){
        const div=document.createElement('div');
        div.innerHTML = buildChatMessage(msg);
        chatMessagesEl.appendChild(div.firstElementChild);
        if(shouldStick) scrollChatToBottom();
      }else if(msg.text){
        const div=document.createElement('div');
        div.innerHTML = buildChatMessage(msg);
        chatMessagesEl.appendChild(div.firstElementChild);
        if(shouldStick) scrollChatToBottom();
      }
    });
    const sendChatMessage = () => {
      const text = chatInputEl.value.trim();
      if(!text) return;
      chatRef.push({from:uid,name:myDisplayName(),text,ts:Date.now()});
      chatInputEl.value='';
      chatInputEl.focus();
      scrollChatToBottom();
    };

    chatSendBtn.onclick = sendChatMessage;
    chatInputEl.onkeydown = (event) => {
      if(event.key === 'Enter'){
        event.preventDefault();
        sendChatMessage();
      }
    };
  }

  // Private room controls
  document.getElementById('room-join-code').addEventListener('click',()=>{
    const code=document.getElementById('room-code-input').value.trim(); if(!code){ log('Enter room code'); return; }
    renderRoomBox(code,false); joinRoom(code,false);
  });
  document.getElementById('room-create').addEventListener('click',()=>{
    const code='ROOM-'+Math.random().toString(36).slice(2,8).toUpperCase();
    document.getElementById('room-code-input').value=code;
    renderRoomBox(code,false); joinRoom(code,false);
    log('Created private room code: '+code);
  });

  // Handle join from URL
  const params=new URLSearchParams(window.location.search); const roomFromLink=params.get('room');
  if(roomFromLink){ renderRoomBox(roomFromLink,false); joinRoom(roomFromLink,false); }

  // Collapsible logs
  const logsToggleEl = document.getElementById('logs-toggle');
  const logsArrowEl = document.getElementById('logs-arrow');
  const logsPanel = document.getElementById('logs');
  if (logsToggleEl) {
    logsToggleEl.addEventListener('click', () => {
      const open = logsPanel.style.display === 'block';
      logsPanel.style.display = open ? 'none' : 'block';
      logsArrowEl.textContent = open ? '▶' : '▼';
      if (!open) logsPanel.scrollTop = logsPanel.scrollHeight;
    });
  }

  // Leave room button
  const leaveBtn = document.getElementById('btn-leave');
  if (leaveBtn) leaveBtn.addEventListener('click', () => disconnectCall());

  window._vac={joinRoom,disconnectCall,uid};
  log('Client ready — uid: '+uid);
  setChatRoomLabel(currentRoom);
  if(sendLocationButton){
    sendLocationButton.addEventListener('click', sendMyLocation);
  }
})();
</script>
