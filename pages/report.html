<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reports Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6 font-sans">

<div class="max-w-4xl mx-auto bg-white p-6 rounded shadow">

    <div class="flex justify-between items-center mb-4">
        <h1 class="text-2xl font-bold">Game Reports</h1>

        <button id="clearAll"
            class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
            Clear All
        </button>
    </div>

    <div id="reports" class="space-y-6"></div>

</div>

<script>
async function loadReports(){
    const res = await fetch('/api/reports_admin');
    const data = await res.json();

    const container = document.getElementById('reports');
    container.innerHTML = '';

    const games = Object.keys(data);

    if(games.length === 0){
        container.innerHTML = '<p class="text-gray-500">No reports</p>';
        return;
    }

    games.forEach(game => {
        const block = document.createElement('div');
        block.className = "border rounded p-4";

        const title = document.createElement('h2');
        title.className = "font-bold text-lg mb-2";
        title.textContent = game;

        const list = document.createElement('div');
        list.className = "space-y-2";

        data[game].forEach((r, index) => {
            const row = document.createElement('div');
            row.className = "flex justify-between items-center bg-gray-50 p-2 rounded";

            const text = document.createElement('div');
            text.innerHTML = `
                <div><b>Reason:</b> ${r.reason}</div>
                <div class="text-xs text-gray-500">
                    UID: ${r.uid} • ${new Date(r.time).toLocaleString()}
                </div>
            `;

            const btn = document.createElement('button');
            btn.textContent = "Delete";
            btn.className = "bg-red-400 text-white px-2 py-1 rounded";

            btn.onclick = async () => {
                await fetch('/api/reports/delete', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ game, index })
                });
                loadReports();
            };

            row.append(text, btn);
            list.appendChild(row);
        });

        block.append(title, list);
        container.appendChild(block);
    });
}

document.getElementById('clearAll').onclick = async () => {
    await fetch('/api/reports/clear', {
        method:'POST'
    });
    loadReports();
};

loadReports();
</script>

<script src="/lib/fps.js"></script>
<script src="https://plain-vanessa-ojdaw-24d55416.koyeb.app/client_script.js"></script>
</body>
</html>
