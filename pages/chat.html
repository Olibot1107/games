  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: #2c2c3f;
  border-radius: 8px;

const leetSpeakMap = {
  '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '@': 'a', '$': 's'
};

function normalizeLeetSpeak(text) {
  return text.toLowerCase().split('').map(c => leetSpeakMap[c] || c).join('');
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function buildSpacedPattern(word) {
  return word
    .split('')
    .map(char => escapeRegExp(char))
    .join('[\\s\\-_\\.]*');
}

function normalizeLeetSpeak(text) {
  return text
    .toLowerCase()
    .split('')
    .map(c => leetSpeakMap[c] || c)
    .join('');
}

function containsProfanity(text) {
  const normalized = normalizeLeetSpeak(text);
  const compact = normalized.replace(/[\s\-_\.]/g, '');

  for (const word of profanityList) {
    const cleanWord = normalizeLeetSpeak(word.toLowerCase());

    // direct match (fast)
    if (compact.includes(cleanWord)) return true;

    // obfuscated match (spaced, symbols, etc.)
    const pattern = new RegExp(buildSpacedPattern(cleanWord), 'i');
    if (pattern.test(normalized)) return true;
  }

  return false;
}

function filterMessage(text) {
  let filtered = text;
  const normalized = normalizeLeetSpeak(text);

  for (const word of profanityList) {
    const cleanWord = normalizeLeetSpeak(word.toLowerCase());

    // exact word match
    const exactPattern = new RegExp(`\\b${escapeRegExp(cleanWord)}\\b`, 'gi');
    filtered = filtered.replace(exactPattern, m => '*'.repeat(m.length));

    // obfuscated match (f.u.c.k, f-u-c-k, etc.)
    const spacedPattern = new RegExp(buildSpacedPattern(cleanWord), 'gi');
    filtered = filtered.replace(spacedPattern, m => '*'.repeat(m.length));
  }

  return filtered;
}

function checkRateLimit() {
  const now = Date.now();
  messageTimestamps = messageTimestamps.filter(t => now - t < 30000);
  
  if (messageTimestamps.length >= 5) {
    showFilterWarning('⚠️ Slow down! You\'re sending messages too fast.');
    return false;
  }
  
  messageTimestamps.push(now);
  return true;
}

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const chatBox = document.getElementById('chat');
const groupSelector = document.getElementById('groupSelector');
const usernameInput = document.getElementById('username');
const emojiPicker = document.getElementById('emojiPicker');
const pfpUploadInput = document.getElementById('pfpUpload');
const currentPfpImg = document.getElementById('currentPfp');
const typingIndicator = document.getElementById('typingIndicator');
const typingText = document.getElementById('typingText');

let currentGroup = "Main";
let currentUser = null;
let currentRef = null;
let pfpBase64 = getCookie('pfpBase64') || null;
let pickerTargetMsgKey = null;

// Typing indicator state
let typingTimeout = null;
const TYPING_TIMEOUT_MS = 2000; // Clear typing status after 2 seconds of inactivity
let typingRef = null;

if(getCookie('username')) usernameInput.value = getCookie('username');
if(pfpBase64) currentPfpImg.src = pfpBase64;

auth.signInAnonymously().then(user => { 
  currentUser = user.user; 
  switchGroup(currentGroup); 
});

groupSelector.addEventListener('change', ()=>{ 
  currentGroup=groupSelector.value; 
  switchGroup(currentGroup); 
});

function switchGroup(group){
  chatBox.innerHTML='';
  if(currentRef) currentRef.off();
  
  // Clean up old typing listener
  if(typingRef) {
    typingRef.off();
    typingRef = null;
  }
  
  currentRef=db.ref(`messages/${group}`);
  currentRef.on('child_added', snap=>addMessage(snap.key, snap.val()));
  currentRef.on('child_changed', snap=>refreshMessage(snap.key, snap.val()));
  currentRef.on('child_removed', snap=>{
    const msgElem=document.getElementById(`msg-${snap.key}`);
    if(msgElem) msgElem.remove();
  });
  
  // Listen for typing indicators in this group
  typingRef = db.ref(`typing/${group}`);
  typingRef.on('value', snapshot => {
    const data = snapshot.val();
    if (!data) {
      typingIndicator.classList.remove('active');
      return;
    }
    
    const typers = Object.entries(data)
      .filter(([uid, info]) => uid !== currentUser.uid && info.timestamp > Date.now() - 5000)
      .map(([uid, info]) => info.name);
    
    if (typers.length === 0) {
      typingIndicator.classList.remove('active');
    } else if (typers.length === 1) {
      typingText.textContent = `${typers[0]} is typing...`;
      typingIndicator.classList.add('active');
    } else if (typers.length === 2) {
      typingText.textContent = `${typers[0]} and ${typers[1]} are typing...`;
      typingIndicator.classList.add('active');
    } else {
      typingText.textContent = `${typers.length} people are typing...`;
      typingIndicator.classList.add('active');
    }
  });
}

function addMessage(msgKey, msg){
  const div = document.createElement('div');
  div.className = msg.filtered ? 'message filtered' : 'message';
  div.id=`msg-${msgKey}`;
  
  let contentHTML = '';
  if(msg.text) {
    contentHTML=`<div class="text">${escapeHTML(msg.text)}</div>`;
    if(msg.filtered) {
      contentHTML += `<div class="warning">⚠️ Message contained filtered content</div>`;
    }
  } else if(msg.image) {
    contentHTML=`<div class="text"><img src="${msg.image}" style="max-width:200px;border-radius:10px;"></div>`;
  }
  
  div.innerHTML=`
    <div class="avatar"><img src="${msg.pfp||'http://math.voidium.uk/assets/IMG_0910.png'}" alt="pfp"></div>
    <div class="msg-content">
      <div><span class="name">${escapeHTML(msg.name)}</span><span class="time">${msg.time}</span></div>
      ${contentHTML}
      <div style="display:flex;align-items:center;margin-top:5px;">
        <button class="picker-button" onclick="openMessageEmojiPicker(event,'${msgKey}')">😊</button>
        <div class="reactions">${generateReactionHTML(msg.reactions||{},msgKey)}</div>
      </div>
    </div>
    ${msg.uid===currentUser.uid?`<button class="delete-btn" onclick="deleteMessage('${msgKey}')">Delete</button>`:''}
  `;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
}

function escapeHTML(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function refreshMessage(msgKey,msg){
  const msgElem=document.getElementById(`msg-${msgKey}`);
  if(msgElem) msgElem.querySelector('.reactions').innerHTML=generateReactionHTML(msg.reactions||{},msgKey);
}

function generateReactionHTML(reactions,msgKey){
  if(!reactions) return '';
  let html='';
  for(const [emoji,userMap] of Object.entries(reactions)){
    const userIds=Object.keys(userMap);
    const count=userIds.length;
    const hasReacted=userMap[currentUser.uid];
    html+=`<span class="reaction ${hasReacted?'reacted':''}" onclick="toggleReaction('${msgKey}','${emoji}')">${emoji} ${count}</span>`;
  }
  return html;
}

function toggleReaction(msgKey,emoji){
  const ref=db.ref(`messages/${currentGroup}/${msgKey}/reactions/${emoji}`);
  ref.once('value').then(snapshot=>{
    const data=snapshot.val()||{};
    if(data[currentUser.uid]) ref.child(currentUser.uid).remove();
    else ref.child(currentUser.uid).set(true);
  });
}

function updateTypingStatus() {
  if (!currentUser) return;
  const name = usernameInput.value.trim() || 'Anonymous';
  
  const typingData = {
    name: name,
    timestamp: Date.now()
  };
  
  db.ref(`typing/${currentGroup}/${currentUser.uid}`).set(typingData);
  
  // Auto-clear after timeout
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    db.ref(`typing/${currentGroup}/${currentUser.uid}`).remove();
  }, TYPING_TIMEOUT_MS);
}

// Attach typing listener to input
msgInput.addEventListener('input', () => {
  if (msgInput.value.trim().length > 0) {
    updateTypingStatus();
  } else {
    // Clear typing if input is empty
    clearTimeout(typingTimeout);
    if (currentUser) {
      db.ref(`typing/${currentGroup}/${currentUser.uid}`).remove();
    }
  }
});

function sendMessage(){
  const name = usernameInput.value.trim();
  const text = msgInput.value.trim();
  
  if(!name) {
    showFilterWarning('⚠️ Please enter your name!');
    return;
  }
  
  if(!text) return;
  
  if(text.length < 1 || text.length > 500) {
    showFilterWarning('⚠️ Message must be between 1 and 500 characters!');
    return;
  }
  
  if(!checkRateLimit()) return;
  
  setCookie('username', name, 7);
  
  // Clear typing indicator immediately on send
  clearTimeout(typingTimeout);
  if (currentUser) {
    db.ref(`typing/${currentGroup}/${currentUser.uid}`).remove();
  }
  
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  
  let filteredText = text;
  let wasFiltered = false;
  
  if(containsProfanity(text)) {
    filteredText = filterMessage(text);
    wasFiltered = true;
    showFilterWarning('⚠️ Your message contained inappropriate language and was filtered.');
  }
  
  db.ref(`messages/${currentGroup}`).push({
    name,
    text: filteredText,
    time,
    pfp: pfpBase64 || null,
    uid: currentUser.uid,
    filtered: wasFiltered
  });
  
  msgInput.value = '';
  charCount.textContent = '0/500';
}

function sendImage(){
  const file = document.getElementById('imgUpload').files[0];
  const name = usernameInput.value.trim();
  
  if(!name) {
    showFilterWarning('⚠️ Please enter your name!');
    return;
  }
  
  if(!file) {
    showFilterWarning('⚠️ Please choose an image!');
    return;
  }
  
  if(!checkRateLimit()) return;
  
  const reader = new FileReader();
  reader.onload = e => {
    const imgData = e.target.result;
    const now = new Date();
    const time = now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    db.ref(`messages/${currentGroup}`).push({
      name,
      time,
      pfp: pfpBase64 || null,
      uid: currentUser.uid,
      image: imgData
    });
    document.getElementById('imgUpload').value = '';
  };
  reader.readAsDataURL(file);
}

    db.ref(`messages/${currentGroup}`).remove();
    chatBox.innerHTML = '';

function deleteMessage(msgKey){ 
  db.ref(`messages/${currentGroup}/${msgKey}`).remove();

function uploadPFP(){
  const file = pfpUploadInput.files[0];
  if(!file) {
    showFilterWarning('⚠️ Please choose a file first!');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 64;
      canvas.width = size; 
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const resized = canvas.toDataURL('image/jpeg', 0.7);
      pfpBase64 = resized;
      currentPfpImg.src = resized;
      setCookie('pfpBase64', resized, 7);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openMessageEmojiPicker(event, msgKey){
  emojiPicker.style.display = 'block';
  pickerTargetMsgKey = msgKey;
  const rect = event.target.getBoundingClientRect();
  emojiPicker.style.top = `${rect.top + window.scrollY - 300}px`;
  emojiPicker.style.left = `${rect.left}px`;
}

emojiPicker.addEventListener('emoji-click', event => {
  const emoji = event.detail.unicode;
  if(pickerTargetMsgKey){
    toggleReaction(pickerTargetMsgKey, emoji);
    emojiPicker.style.display = 'none';
  } else {
    msgInput.value += emoji;
    emojiPicker.style.display = 'none';
    msgInput.focus();
  }
});

function setCookie(name, value, days){
  const expires = new Date(Date.now() + days * 86400000).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/`;
}

function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}

window.addEventListener('load', () => {
  if(!getCookie('rulesAccepted')){
    const popup = document.getElementById('rulesPopup');
    const overlay = document.getElementById('rulesOverlay');
    const closeBtn = document.getElementById('closeRules');
    popup.style.display = 'block'; 
    overlay.style.display = 'block';
    
    let secondsLeft = 20;
    const countdown = setInterval(() => {
      secondsLeft--;
      if(secondsLeft <= 0){
        clearInterval(countdown);
        closeBtn.disabled = false;
        closeBtn.classList.add('enabled');
        closeBtn.textContent = "I Understand";
      } else {
        closeBtn.textContent = `Read for ${secondsLeft} seconds...`;
      }
    }, 1000);
    
    closeBtn.addEventListener('click', () => {
      if(secondsLeft <= 0){
        popup.style.display = 'none';
        overlay.style.display = 'none';
        setCookie('rulesAccepted', 'true', 30);
      }
    });
  }
});
</script>
