*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {

/* ── Nav ──────────────────────────────────────────────────────────────────── */

.nav-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.4); flex-shrink: 0; }
.nav-chip {

  background: rgba(40,15,4,0.6);

  border-radius: 999px;
  padding: 5px 12px;

.nav-chip:hover { background: rgba(70,28,6,0.75); border-color: rgba(251,146,60,0.38); color: rgba(255,255,255,0.9); }
.nav-chip.active { background: rgba(251,146,60,0.15); border-color: rgba(251,146,60,0.48); color: rgba(251,146,60,0.95); }

/* ── Page layout ──────────────────────────────────────────────────────────── */
.page {

  flex-direction: column;
  height: 100vh;
  padding-top: 60px;
}

/* ── Profile / settings bar ───────────────────────────────────────────────── */
.profile-bar {

  background: rgba(10,4,0,0.7);

}

  border-radius: 8px;

  width: 130px; font-family: inherit;
}
.profile-bar input[type="text"]:focus { border-color: rgba(251,146,60,0.5); box-shadow: 0 0 0 2px rgba(251,146,60,0.08); }
.profile-bar input[type="file"] { font-size: 11px; color: rgba(255,255,255,0.35); }
#currentPfp {

  border: 1.5px solid rgba(251,146,60,0.35); flex-shrink: 0;
}
.btn-sm {
  background: rgba(40,15,4,0.75);
  border: 1px solid rgba(251,146,60,0.22);
  border-radius: 8px;
  padding: 5px 10px; font-size: 12px;
  color: rgba(251,146,60,0.8);
  cursor: pointer; transition: all 0.15s; font-family: inherit; white-space: nowrap;
}
.btn-sm:hover { background: rgba(70,28,6,0.8); border-color: rgba(251,146,60,0.5); color: rgba(251,146,60,1); }

/* ── Chat messages ────────────────────────────────────────────────────────── */
.chat-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

#chat {
  flex: 1; overflow-y: auto;
  padding: 10px 14px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: rgba(251,146,60,0.2) transparent;
}
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-thumb { background: rgba(251,146,60,0.2); border-radius: 4px; }

.message {
  display: flex; gap: 10px;
  margin-bottom: 8px;
  background: rgba(18,7,1,0.8);
  border: 1px solid rgba(255,255,255,0.04);
  padding: 9px 12px;
  border-radius: 12px;

  transition: background 0.12s;
}
.message:hover { background: rgba(26,10,2,0.9); }
.message.filtered { background: rgba(50,8,8,0.75); border-left: 3px solid rgba(239,68,68,0.7); }
.avatar img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

.reaction {

.typing-dot {

}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%,80%,100% { transform: scale(0); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }

/* ── Toast ────────────────────────────────────────────────────────────────── */
#filterWarning {
  position: fixed; bottom: 76px; right: 16px;
  background: rgba(25,5,5,0.94);
  border: 1px solid rgba(239,68,68,0.4);
  color: #f87171; padding: 10px 16px; border-radius: 10px;
  display: none; z-index: 1000; font-size: 13px;
  backdrop-filter: blur(8px);
  animation: slideIn 0.25s ease; max-width: 300px;
}
@keyframes slideIn { from { transform: translateX(320px); opacity:0; } to { transform: translateX(0); opacity:1; } }

/* ── Message entrance animation ──────────────────────────────────────────── */
@keyframes msgIn {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
.message { animation: msgIn 0.14s ease; }

/* ── Grouped consecutive messages ────────────────────────────────────────── */
.message.grouped { margin-top: 1px; border-top-left-radius: 4px; border-top-right-radius: 4px; }
.message.grouped .avatar img { opacity: 0; pointer-events: none; }
.message.grouped .msg-header { display: none; }

/* ── Image lightbox ──────────────────────────────────────────────────────── */
#img-lightbox {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; cursor: zoom-out;

/* ── Timestamped time tooltip ─────────────────────────────────────────────── */

/* ── Scroll-to-bottom button ──────────────────────────────────────────────── */
#scroll-down-btn {

@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.7); }

const leetSpeakMap = {
  '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '8': 'b', '@': 'a', '$': 's'
};

function normalizeLeetSpeak(text) {
  return text.toLowerCase().split('').map(c => leetSpeakMap[c] || c).join('');
}

function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function buildSpacedPattern(word) {
  return word
    .split('')
    .map(char => escapeRegExp(char))
    .join('[\\s\\-_\\.]*');
}

function containsProfanity(text) {
  const normalized = normalizeLeetSpeak(text);

    const pattern = new RegExp(buildSpacedPattern(cleanWord), 'i');
    if (pattern.test(normalized)) return true;
  }

  return false;
}

    const exactPattern = new RegExp(`\\b${escapeRegExp(cleanWord)}\\b`, 'gi');
    filtered = filtered.replace(exactPattern, m => '*'.repeat(m.length));

    // obfuscated match (f.u.c.k, f-u-c-k, etc.)
    const spacedPattern = new RegExp(buildSpacedPattern(cleanWord), 'gi');
    filtered = filtered.replace(spacedPattern, m => '*'.repeat(m.length));
  }

  return filtered;
}

function showFilterWarning(message) {

  warning.style.display = 'block';

}

function buildMapEmbedUrl(lat, lon) {
  const delta = 0.008;
  const left = lon - delta;
  const right = lon + delta;
  const top = lat + delta;
  const bottom = lat - delta;
  return `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(left)},${encodeURIComponent(bottom)},${encodeURIComponent(right)},${encodeURIComponent(top)}&layer=mapnik&marker=${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;
}

function buildLocationHtml(location) {
  const { lat, lon, place } = location;
  const mapUrl = buildMapEmbedUrl(lat, lon);
  const coords = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
  const placeHtml = place ? `<div class="location-meta"><strong>Place:</strong> ${escapeHTML(place)}</div>` : '';
  return `
    <div class="location-card">
      <div class="location-meta"><strong>Coords:</strong> ${coords}</div>
      ${placeHtml}
      <iframe class="location-map" loading="lazy" src="${mapUrl}" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="location-meta" style="margin-top:6px;">
        <a class="location-link" href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(lat)}&mlon=${encodeURIComponent(lon)}#map=18/${encodeURIComponent(lat)}/${encodeURIComponent(lon)}" target="_blank" rel="noopener">Open full map</a>
      </div>
    </div>
  `;
}

function formatLocationLabel(lat, lon, place) {
  if (place) return place;
  return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
}

async function fetchReverseLocation(lat, lon) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
  const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!response.ok) throw new Error(`Location lookup failed (${response.status})`);
  const data = await response.json();
  return data?.display_name || data?.name || '';
}

async function getPreciseLocation() {
  if (!navigator.geolocation) {
    throw new Error('This browser does not support location.');
  }

  const position = await new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    });
  });

  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  let place = '';
  try {
    place = await fetchReverseLocation(lat, lon);
  } catch (err) {
    place = '';
  }
  return { lat, lon, place };
}

    html+=`<span class="reaction ${hasReacted?'reacted':''}" onclick="toggleReaction('${msgKey}','${emoji}')">${emoji} ${count}</span>`;
  }
  return html;
}

// Notification sound (Web Audio, very subtle)
function playMsgSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.055, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.32);
  } catch(e) {}
}
