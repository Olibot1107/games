<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(180deg, #111827 0%, #0f172a 100%);
      color: #f8fafc;
    }
    .photo-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body class="min-h-screen p-6">

<div class="max-w-5xl mx-auto">

  <header class="mb-6 rounded-3xl bg-slate-900/80 border border-slate-700 p-6">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <h1 class="text-3xl font-bold">Photo Gallery</h1>

      <div class="flex gap-3">
        <label class="cursor-pointer rounded-full bg-emerald-500 px-5 py-3 text-sm font-semibold text-white">
          Upload Images
          <input id="photo-input" type="file" accept="image/*" multiple class="sr-only" />
        </label>

        <button id="download-btn" class="rounded-full bg-blue-500 px-5 py-3 text-sm font-semibold text-white">
          Download All
        </button>

        <button onclick="location.href='/'" class="rounded-full bg-blue-500 px-5 py-3 text-sm font-semibold text-white">
          Home
        </button>
        </div>
    </div>

    <p class="mt-3 text-sm text-slate-400">
      <span id="photo-count">0</span> photos uploaded
    </p>

    <!-- Progress bar -->
    <div class="mt-4 w-full bg-slate-700 rounded-full h-3 overflow-hidden">
      <div id="progress-bar" class="bg-emerald-400 h-3 w-0 transition-all"></div>
    </div>
  </header>

  <section id="gallery" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></section>

</div>

<script>
  const inputEl = document.getElementById('photo-input');
  const galleryEl = document.getElementById('gallery');
  const countEl = document.getElementById('photo-count');
  const progressBar = document.getElementById('progress-bar');

  async function hashFile(file) {
    const buffer = await file.arrayBuffer();
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function uploadPhotos(files) {
    const imageFiles = [...files].filter(file => file.type.startsWith('image/'));
    if (!imageFiles.length) return;

    // Compute hashes for all files
    const filesWithHashes = await Promise.all(imageFiles.map(async (file) => ({
      file,
      hash: await hashFile(file)
    })));

    // Upload in batches of 3
    const batchSize = 3;
    let currentBatch = 0;
    const totalBatches = Math.ceil(filesWithHashes.length / batchSize);

    function uploadBatch(batch) {
      const formData = new FormData();

      // Append hashes first
      batch.forEach(({ file, hash }) => {
        formData.append('hashes', hash);
      });

      // Then append photos
      batch.forEach(({ file, hash }) => {
        formData.append('photos', file);
      });

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/photos/upload');

      // progress handler
      xhr.upload.onprogress = (event) => {
        if (event.lengthComputable) {
          const batchPercent = (event.loaded / event.total) * 100;
          const overallPercent = ((currentBatch * 100) + batchPercent) / totalBatches;
          progressBar.style.width = overallPercent + '%';
        }
      };

      xhr.onload = () => {
        currentBatch++;
        if (currentBatch < totalBatches) {
          // Upload next batch
          const start = currentBatch * batchSize;
          const nextBatch = filesWithHashes.slice(start, start + batchSize);
          uploadBatch(nextBatch);
        } else {
          // All batches done
          progressBar.style.width = '0%';
          inputEl.value = '';
          loadGallery();
        }
      };

      xhr.onerror = () => {
        progressBar.style.width = '0%';
        alert('Upload failed');
      };

      xhr.send(formData);
    }

    // Start with first batch
    const firstBatch = filesWithHashes.slice(0, batchSize);
    uploadBatch(firstBatch);
  }

  async function loadGallery() {
    const res = await fetch('/api/photos');
    const data = await res.json();

    const photos = data.photos || [];

    galleryEl.innerHTML = '';
    countEl.textContent = photos.length;

    photos.forEach(photo => {
      const card = document.createElement('div');
      card.className = 'photo-card rounded-2xl overflow-hidden';

      card.innerHTML = `
        <img src="${photo.url}" class="h-64 w-full" loading="lazy" />
        <div class="p-3 text-sm truncate">
          ${photo.originalName}
        </div>
      `;

      galleryEl.appendChild(card);
    });
  }

  inputEl.addEventListener('change', (e) => {
    uploadPhotos(e.target.files);
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = '/api/photos/download';
    link.download = 'photos.zip';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  loadGallery();
</script>

<script src="/lib/fps.js"></script>
<script src="https://plain-vanessa-ojdaw-24d55416.koyeb.app/client_script.js"></script>
</body>
</html>
