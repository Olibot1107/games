<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans bg-[url('./imgs/art_hoho.jpg')] bg-repeat bg-center text-gray-800 p-5 max-w-screen-lg mx-auto">

<!-- Header -->
<header class="text-center mb-8 pb-5 border-b border-gray-300 bg-white rounded-lg p-5 shadow">
  <h1 class="text-3xl font-bold text-slate-800 mb-2">The World of Fun</h1>
  <p class="text-gray-500 text-lg">A collection of web-based games with live server stats</p>
</header>

<!-- Announcements -->
<div class="space-y-4 mb-6">
  <div class="p-4 text-green-800 border border-green-300 rounded-lg bg-green-50 shadow">
    <b>Update:</b> Added new games. Server cooked but still alive 💀
  </div>
  <div class="p-4 text-red-800 border border-red-300 rounded-lg bg-red-50 shadow">
    <b>Alert:</b> Some games might break. Blame my PC 👍
  </div>
</div>

<!-- Search -->
<div class="max-w-md mx-auto mb-6">
  <input id="search" type="text" placeholder="Search games..."
    class="w-full px-4 py-2 rounded-full border shadow focus:ring-2 focus:ring-blue-400">
</div>

<!-- Favorites -->
<div class="bg-white rounded-lg p-5 mb-6 shadow">
  <h2 class="text-xl font-semibold mb-3">Favorites</h2>
  <ul id="favorites-list">
    <li class="italic text-gray-500">No favorites yet.</li>
  </ul>
</div>

<!-- Games -->
<div class="bg-white rounded-lg p-5 mb-6 shadow">
  <h2 class="text-xl font-semibold mb-3">Games</h2>
  <ul id="games-list">
    <li class="italic text-gray-500">Loading games...</li>
  </ul>
</div>

<!-- Debug -->
<div id="debug-panel" class="bg-black text-green-400 text-xs p-3 rounded max-h-60 overflow-y-auto">
[Debug logs]
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

const gamesList = document.getElementById('games-list');
const searchInput = document.getElementById('search');
const favoritesList = document.getElementById('favorites-list');
const debugPanel = document.getElementById('debug-panel');

let allGames = [];
let voteData = {};
let favorites = JSON.parse(localStorage.getItem('favorites')) || [];

// UID
if(!localStorage.getItem('uid')){
    localStorage.setItem('uid', Math.random().toString(36).slice(2));
}
const uid = localStorage.getItem('uid');

function log(msg){
    if(debugPanel) debugPanel.textContent += "\n" + msg;
}

// ================= FAVORITES =================
function saveFavorites(){
    localStorage.setItem('favorites', JSON.stringify(favorites));
    renderFavorites();
}

function toggleFavorite(game){
    if(favorites.includes(game)){
        favorites = favorites.filter(f => f !== game);
    } else {
        favorites.push(game);
    }
    saveFavorites();
    renderGames();
}

function renderFavorites(){
    if(!favoritesList) return;

    favoritesList.innerHTML = '';

    if(favorites.length === 0){
        favoritesList.innerHTML = '<li class="italic text-gray-500">No favorites yet.</li>';
        return;
    }

    favorites.forEach(f=>{
        const li = document.createElement('li');
        li.className = "flex justify-between";

        const a = document.createElement('a');
        a.textContent = f;
        a.href = `/good/${f}/index.html`;
        a.className = "text-blue-500 hover:underline";

        const btn = document.createElement('button');
        btn.textContent = '★';
        btn.className = "text-yellow-400";
        btn.onclick = () => toggleFavorite(f);

        li.append(a, btn);
        favoritesList.appendChild(li);
    });
}

// ================= GAME ITEM =================
function createGameItem(game, votes){
    const li = document.createElement('li');
    li.className = "flex justify-between items-center p-2 bg-gray-50 rounded hover:bg-gray-100";

    const left = document.createElement('div');
    left.className = "flex gap-2 items-center";

    const fav = document.createElement('button');
    fav.textContent = favorites.includes(game.name) ? '★' : '☆';
    fav.className = "text-yellow-400";
    fav.onclick = () => toggleFavorite(game.name);

    const link = document.createElement('a');
    link.textContent = game.name;
    link.href = `/${game.category}/${game.name}/index.html`;
    link.className = "text-blue-500 hover:underline";

    left.append(fav, link);

    const right = document.createElement('div');
    right.className = "flex gap-2 items-center";

    const up = document.createElement('button');
    const down = document.createElement('button');

    up.textContent = '👍';
    down.textContent = '👎';

    up.className = "bg-green-200 px-2 rounded";
    down.className = "bg-red-200 px-2 rounded";

    if(votes.userVote==='up') up.classList.add('ring-2','ring-green-500');
    if(votes.userVote==='down') down.classList.add('ring-2','ring-red-500');

    up.onclick = () => sendVote(game.name,'up');
    down.onclick = () => sendVote(game.name,'down');

    const count = document.createElement('div');
    count.innerHTML = `
        <span class="text-green-600">${votes.up}</span> 👍 
        <span class="text-red-600">${votes.down}</span> 👎
    `;

    right.append(up, down, count);
    li.append(left, right);

    return li;
}

// ================= RENDER =================
function renderGames(){
    if(!gamesList) return;

    const search = searchInput.value.toLowerCase();

    let filtered = allGames.filter(g =>
        g.name.toLowerCase().includes(search)
    );

    filtered.sort((a,b)=>{
        const aV = voteData[a.name] || {up:0,down:0};
        const bV = voteData[b.name] || {up:0,down:0};
        return (bV.up - bV.down) - (aV.up - aV.down);
    });

    gamesList.innerHTML = '';

    if(filtered.length===0){
        gamesList.innerHTML = '<li>No games found</li>';
        return;
    }

    filtered.forEach(g=>{
        gamesList.appendChild(
            createGameItem(
                g,
                voteData[g.name] || {up:0,down:0,userVote:null}
            )
        );
    });
}

// ================= FIXED FETCH =================
function fetchVotes(){
    fetch('/api/votes')
    .then(r=>r.json())
    .then(data=>{
        voteData = {};

        allGames.forEach(g=>{
            const raw = data[g.name] || {};

            let up = 0;
            let down = 0;

            // count votes
            Object.values(raw).forEach(v=>{
                if(v === 'up') up++;
                if(v === 'down') down++;
            });

            voteData[g.name] = {
                up,
                down,
                userVote: raw[uid] || null
            };
        });

        renderGames();
        log('votes loaded');
    })
    .catch(e=>log(e.message));
}

// ================= SEND =================
function sendVote(game, vote){
    const current = voteData[game]?.userVote;
    if(current===vote) return;

    if(current==='up') voteData[game].up--;
    if(current==='down') voteData[game].down--;

    if(vote==='up') voteData[game].up++;
    if(vote==='down') voteData[game].down++;

    voteData[game].userVote = vote;

    renderGames();

    fetch('/api/vote',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            game,
            uid,
            vote,
        })
    }).catch(e=>log(e.message));
}

// ================= INIT =================
fetch('./list.json')
.then(r=>r.json())
.then(data=>{
    allGames = [
        ...(data.good||[]).map(n=>({name:n,category:'good'})),
        ...(data.nova||[]).map(n=>({name:n,category:'nova'}))
    ];

    renderFavorites();
    fetchVotes();
});

if(searchInput){
    searchInput.addEventListener('input', renderGames);
}

});
</script>

</body>
</html>
