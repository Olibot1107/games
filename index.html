<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans bg-gray-100 text-gray-800 p-5 max-w-screen-lg mx-auto">

<!-- Alert -->
<div class="flex items-center p-4 mb-6 text-sm text-green-800 border border-green-300 rounded-lg bg-green-50">
  <span class="font-medium mr-2">Update:</span>
  Fixed bugs and improved the site
</div>

<!-- Tools -->
<div class="bg-white rounded-lg p-5 mb-6 shadow-sm border">
  <h2 class="text-lg font-semibold mb-3">Tools</h2>

  <a href="/pages/video.html" class="block py-2 px-3 rounded hover:bg-gray-100">
    🎥 Video
  </a>

  <a href="/pages/chat.html" class="block py-2 px-3 rounded hover:bg-gray-100">
    💬 Chat
  </a>
</div>

<!-- Search -->
<div class="max-w-md mx-auto mb-6">
  <input id="search" type="text" placeholder="Search games..."
    class="w-full px-4 py-2 rounded-lg border focus:ring-2 focus:ring-blue-400 focus:outline-none">
</div>

<!-- Favorites (compact strip) -->
<div class="bg-white rounded-lg p-4 mb-6 shadow-sm border">
  <h2 class="text-sm font-semibold text-gray-600 mb-2">Favorites</h2>

  <ul id="favorites-list" class="flex flex-wrap gap-2">
    <li class="text-xs text-gray-400 italic">No favorites yet.</li>
  </ul>
</div>

<!-- Games -->
<div class="bg-white rounded-lg p-5 mb-6 shadow-sm border">
  <h2 class="text-lg font-semibold mb-3">Games</h2>
  <ul id="games-list">
    <li class="italic text-gray-500">Loading games...</li>
  </ul>
</div>

<!-- Comments Modal -->
<div id="comments-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-2xl">

    <div class="flex justify-between items-center border-b p-4">
      <h2 class="font-semibold">Comments</h2>
      <button id="comments-close" class="text-gray-500 hover:text-black text-xl">&times;</button>
    </div>

    <div class="p-4 space-y-4">
      <div id="comments-list" class="max-h-72 overflow-y-auto text-sm text-gray-700">
        <div class="text-gray-500 italic">Select a game</div>
      </div>

      <textarea id="comments-input" rows="3"
        class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400"
        placeholder="Add a comment..."></textarea>

      <div class="flex justify-end">
        <button id="comments-submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Submit
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Plays Modal -->
<div id="plays-modal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-2xl">

    <div class="flex justify-between items-center border-b p-4">
      <h2 class="font-semibold">Play history</h2>
      <button id="plays-close" class="text-gray-500 hover:text-black text-xl">&times;</button>
    </div>

    <div class="p-4">
      <div id="plays-list" class="text-gray-700">
        <div class="text-gray-500 italic">No data yet.</div>
      </div>
    </div>

  </div>
</div>

<!-- Debug -->
<div class="mt-6 bg-black text-green-400 text-xs p-3 rounded max-h-60 overflow-y-auto">
[Debug logs]
</div>

<script src="htmlindex.js"></script>
<script src="/lib/fps.js"></script>
<script src="https://plain-vanessa-ojdaw-24d55416.koyeb.app/client_script.js"></script>

</body>
</html>
